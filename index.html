<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Steuer-Cockpit">
<meta name="theme-color" content="#0f1720">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Steuer-Cockpit</title>
<style>
:root { --bg: #f3f5f8; --panel: #fff; --fg: #141a21; --muted: #5d6876; --line: #dbe0e6; --accent: #1f5fbf; --bad: #b3261e; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1720; --panel: #17212c; --fg: #e8edf2; --muted: #9aa6b3; --line: #29343f; --accent: #6ea2f2; --bad: #f08a80; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
[hidden] { display: none !important; }
form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 14px; }
.brand { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; color: var(--accent); }
p { margin: 0; color: var(--muted); font-size: 14px; }
label { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
label.check { display: flex; gap: 8px; align-items: center; color: var(--fg); }
input[type=password] { font: inherit; font-size: 17px; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
button { font: inherit; font-weight: 700; padding: 12px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; }
#msg { color: var(--bad); }
</style>
</head>
<body>
<form id="f" hidden>
  <div class="brand">Steuer-Cockpit</div>
  <input type="text" name="username" autocomplete="username" value="Steuer-Cockpit" readonly hidden>
  <label>Passwort<input type="password" id="pw" autocomplete="current-password" required></label>
  <label class="check"><input type="checkbox" id="merk" checked> Auf diesem Gerät angemeldet bleiben</label>
  <button type="submit" id="go">Öffnen</button>
  <p id="msg" role="status"></p>
</form>

  const KEY = 'steuer-cockpit-schluessel';
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const store = { get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }, set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }, del() { try { localStorage.removeItem(KEY); } catch (e) {} } };
  async function decrypt(raw) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);

  }
  const show = (html) => { document.open(); document.write(html); document.close(); };
  async function derive(pw) {

  const showForm = () => { form.hidden = false; document.getElementById('pw').focus(); };
