<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Steuer-Cockpit">

<link rel="manifest" href="manifest.json">
<title>Steuer-Cockpit</title>
<style>
:root {
  --bg: #f3f5f8; --panel: #ffffff; --fg: #141a21; --muted: #5d6876; --line: #dbe0e6;
  --accent: #1f5fbf; --accent-fg: #ffffff; --soft: #eaf1fb;
  --good: #1d7a46; --good-bg: #e5f4ea; --warn: #8a5a00; --warn-bg: #fdf1d8; --bad: #b3261e; --bad-bg: #fbe6e4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1720; --panel: #17212c; --fg: #e8edf2; --muted: #9aa6b3; --line: #29343f;
    --accent: #6ea2f2; --accent-fg: #0f1720; --soft: #1b2a3b;
    --good: #6fcf97; --good-bg: #16302a; --warn: #f2c25b; --warn-bg: #362b13; --bad: #f08a80; --bad-bg: #3a1d1b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
[hidden] { display: none !important; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px; border-bottom: 1px solid var(--line); }
header.top .row { max-width: 860px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; color: var(--accent); }
.firm { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
main { max-width: 860px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.35rem; margin: 4px 0 12px; }
h2 { font-size: 1.05rem; margin: 0 0 8px; }
h3 { font-size: .95rem; margin: 14px 0 6px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.status { border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--line); background: var(--panel); }
.status .big { font-size: 1.25rem; font-weight: 700; }
.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.todo li:first-child { border-top: 0; padding-top: 0; }
.todo .dot { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; background: var(--muted); }
.dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); } .dot.good { background: var(--good); }
.todo .grow { flex: 1; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.tile .q { font-size: 13px; color: var(--muted); }
.tile .v { font-size: 1.2rem; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; }
.tile .e { font-size: 12.5px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--accent); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.grey { background: var(--line); color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.item { display: flex; gap: 10px; align-items: center; padding: 11px 2px; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { font-size: 13px; color: var(--muted); }
.item .amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button, .btn { font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-block; }
.btn.primary, button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger, button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: not-allowed; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); }
details { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 14px; }
label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
label.check { display: flex; gap: 8px; align-items: center; color: var(--fg); }
input, select, textarea { font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
label.check input { width: auto; }
textarea { min-height: 70px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 600px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.full { grid-column: 1 / -1; }
.pos { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
.pos .text { grid-column: 1 / -1; }
@media (min-width: 640px) { .pos { grid-template-columns: 3fr 1fr 1fr 1.2fr 1fr auto; align-items: end; } .pos .text { grid-column: auto; } }
.pos .sum { font-variant-numeric: tabular-nums; font-weight: 600; padding: 9px 0; }
.pos .del { padding: 8px 10px; }
.totals { margin-left: auto; max-width: 320px; font-variant-numeric: tabular-nums; }
.totals div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.totals .gross { font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 4px; }
.checks { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.checks li { padding: 2px 0; }
.checks li.ok::before { content: "✓ "; color: var(--good); font-weight: 700; }
.checks li.miss::before { content: "✗ "; color: var(--bad); font-weight: 700; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .row { max-width: 860px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); }
nav.tabs button { border: 0; border-radius: 0; background: none; padding: 9px 2px 10px; font-size: 12px; font-weight: 600; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 7; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); border: 0; font-size: 32px; line-height: 1; padding: 0; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
dialog { border: 0; padding: 0; background: var(--panel); color: var(--fg); width: 100%; max-width: 760px; max-height: 100%; border-radius: 14px; }
dialog::backdrop { background: rgba(0,0,0,.45); }
@media (max-width: 640px) { dialog { margin: auto 0 0; max-width: 100%; border-radius: 14px 14px 0 0; max-height: 94vh; } }
.dlg-head { position: sticky; top: 0; background: var(--panel); display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); z-index: 1; }
.dlg-head h2 { margin: 0; }
.dlg-body { padding: 16px; }
.dlg-foot { position: sticky; bottom: 0; background: var(--panel); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.x { border: 0; background: none; font-size: 26px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.menu { display: grid; gap: 10px; }
.menu button { display: flex; gap: 12px; align-items: center; text-align: left; padding: 14px; }
.menu .ic { font-size: 24px; width: 34px; text-align: center; }
.menu .t { display: block; font-weight: 700; }
.menu .s { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.preview { max-width: 100%; max-height: 260px; border-radius: 8px; border: 1px solid var(--line); display: block; margin-top: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 20; font-size: 14px; max-width: calc(100% - 32px); }
table.tab { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tab td, table.tab th { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.logo-prev { max-height: 64px; max-width: 220px; display: block; margin: 8px 0; background: #fff; border-radius: 6px; padding: 4px; border: 1px solid var(--line); }
.wiz .opts { display: grid; gap: 8px; margin-top: 10px; }
.wiz .opts button { text-align: left; font-weight: 500; }
.wiz .step { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.drop { border: 2px dashed var(--line); }
.drop.on { border-color: var(--accent); background: var(--soft); }
.upl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.upl button { display: grid; justify-items: center; gap: 2px; padding: 10px 4px; font-size: 13px; }
.upl .ic { font-size: 22px; line-height: 1.2; }
#druck { display: none; }
@media print {
  @page { size: A4; margin: 18mm 16mm; }
  body { background: #fff; color: #000; padding: 0; }
  body > *:not(#druck) { display: none !important; }
  #druck { display: block; font-size: 10.5pt; color: #000; }
  #druck .absender { font-size: 8pt; text-decoration: underline; margin-bottom: 4mm; }
  #druck .kopf { display: flex; justify-content: space-between; gap: 10mm; margin-bottom: 12mm; }
  #druck .meta td { padding: 0 0 1mm 6mm; }
  #druck .logo { display: block; max-height: 22mm; max-width: 60mm; margin: 0 0 4mm auto; }
  #druck h1 { font-size: 16pt; margin: 0 0 6mm; }
  #druck table.p { width: 100%; border-collapse: collapse; margin: 4mm 0; }
  #druck table.p th, #druck table.p td { border-bottom: .3mm solid #999; padding: 2mm 1mm; text-align: left; }
  #druck table.p .r { text-align: right; }
  #druck .sum { margin-left: auto; width: 75mm; }
  #druck .sum div { display: flex; justify-content: space-between; padding: .8mm 0; }
  #druck .sum .g { font-weight: 700; border-top: .4mm solid #000; margin-top: 1mm; padding-top: 1.5mm; }
  #druck .fuss { margin-top: 14mm; font-size: 8.5pt; color: #333; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; border-top: .3mm solid #999; padding-top: 3mm; }
}
</style>
</head>
<body>
<header class="top"><div class="row"><span class="brand">Steuer-Cockpit</span><span class="firm" id="firmname"></span></div></header>
<main id="app"><p class="muted">Lädt …</p></main>
<button class="fab" id="fab" aria-label="Neu: Angebot, Rechnung oder Beleg" data-act="menu">+</button>
<nav class="tabs" aria-label="Bereiche"><div class="row" id="tabs"></div></nav>
<dialog id="dlg"></dialog>
<div id="druck"></div>
<script>
(function () {
'use strict';

/* ---------- Speicher (IndexedDB, bleibt nur auf diesem Gerät) ---------- */
const DBN = 'steuer-cockpit', ST = 'kv';
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DBN, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(ST);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function kv(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(ST, mode), st = tx.objectStore(ST);
    const r = fn(st);
    tx.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
    tx.onerror = () => rej(tx.error);
  });
}
const idbGet = (k) => kv('readonly', (s) => s.get(k));
const idbSet = (k, v) => kv('readwrite', (s) => s.put(v, k));
const idbDel = (k) => kv('readwrite', (s) => s.delete(k));
const idbKeys = () => kv('readonly', (s) => s.getAllKeys());

/* ---------- Grunddaten ---------- */
const RECHTSFORMEN = {
  freiberufler: { label: 'Freiberufler', gewinn: 'EÜR (Einnahmen-Überschuss-Rechnung)', jahr: 'Einkommensteuer mit Anlage S und Anlage EÜR, Umsatzsteuer-Jahreserklärung', extra: 'Keine Gewerbesteuer.' },
  einzel: { label: 'Einzelunternehmen (Gewerbe)', gewinn: 'EÜR; Bilanz erst ab 800.000 € Umsatz oder 80.000 € Gewinn im Jahr', jahr: 'Einkommensteuer mit Anlage G und Anlage EÜR, Gewerbesteuer, Umsatzsteuer-Jahreserklärung', extra: 'Gewerbesteuer-Freibetrag 24.500 €.' },
  ek: { label: 'e.K. (eingetragener Kaufmann)', gewinn: 'Bilanz nach HGB, unter denselben Grenzen wie beim Einzelunternehmen befreit', jahr: 'Wie Einzelunternehmen, mit Bilanz zusätzlich E-Bilanz', extra: 'Eintrag im Handelsregister.' },
  gbr: { label: 'GbR / eGbR', gewinn: 'EÜR, solange nicht buchführungspflichtig', jahr: 'Feststellungserklärung, Gewerbesteuer wenn gewerblich, Umsatzsteuer; jeder Gesellschafter macht seine eigene Einkommensteuer', extra: 'Gewinn wird auf die Gesellschafter verteilt.' },
  ohg: { label: 'OHG / KG / GmbH & Co. KG', gewinn: 'Bilanz nach HGB', jahr: 'Feststellungserklärung, E-Bilanz, Gewerbesteuer, Umsatzsteuer', extra: 'Gewinnverteilung auf Gesellschafter, Kapitalkonten.' },
  ug: { label: 'UG (haftungsbeschränkt)', gewinn: 'Bilanz und GuV nach HGB', jahr: 'Körperschaftsteuer, Gewerbesteuer, Umsatzsteuer, E-Bilanz', extra: '25 % des Jahresüberschusses in die Rücklage; Jahresabschluss offenlegen.' },
  gmbh: { label: 'GmbH', gewinn: 'Bilanz und GuV nach HGB', jahr: 'Körperschaftsteuer, Gewerbesteuer, Umsatzsteuer, E-Bilanz', extra: 'Jahresabschluss offenlegen; Lohnsteuer für das Geschäftsführergehalt.' }
};
const KU_HINWEIS = 'Gemäß § 19 UStG wird keine Umsatzsteuer berechnet (Kleinunternehmerregelung).';
const KU_GRENZE = 100000;
const KATEGORIEN = ['Wareneinkauf', 'Büro und Software', 'Telefon und Internet', 'Fahrzeug und Reise', 'Werbung', 'Miete', 'Versicherung', 'Fremdleistung', 'Bewirtung', 'Porto und Versand', 'Bankgebühren', 'Fortbildung', 'Beiträge und Gebühren', 'Anschaffung (Gerät, Möbel)', 'Sonstiges'];
const ZAHLWEGE = [['konto', 'Geschäftskonto'], ['bar', 'Bar'], ['privat', 'Privat ausgelegt'], ['offen', 'Noch nicht bezahlt']];
const REGISTER_RF = ['ek', 'ohg', 'ug', 'gmbh'];

function leer() {
  return {
    v: 2,
    firma: { name: '', inhaber: '', strasse: '', plz: '', ort: '', steuernr: '', ustid: '', email: '', tel: '', iban: '', bic: '', bank: '', rechtsform: '', registergericht: '', registernr: '', logo: '', kleinunternehmer: false, turnus: 'monat', dauerfrist: false, zahlungsziel: 14, angebotTage: 30, basiszins: 1.27 },
    angebote: [], rechnungen: [], belege: [], kunden: [], lieferanten: [], bank: [], zaehler: {}, letzteSicherung: null,
    steuer: { versteuerung: 'soll', hebesatz: 400, berater: false, svz: 0, vzEst: 0, vzGew: 0, erledigt: {} },
    est: {}
  };
}
let S = leer();
let tab = 'start', filter = {};

async function load() {
  const s = await idbGet('state');
  if (s) S = Object.assign(leer(), s, { firma: Object.assign(leer().firma, s.firma || {}), steuer: Object.assign(leer().steuer, s.steuer || {}) });
  migriere();
}
/* Ältere Stände: Kunden bekommen eine id, Lieferanten entstehen aus vorhandenen Belegen */
function migriere() {
  S.kunden = S.kunden || []; S.lieferanten = S.lieferanten || [];
  for (const k of S.kunden) if (!k.id) k.id = uid();
  if ((S.v || 1) < 2) {
    for (const b of S.belege.slice().sort((x, y) => (x.datum || '').localeCompare(y.datum || ''))) merkeLieferant(b.lieferant, b.kategorie, b.rc);
    S.v = 2;
  }
  for (const l of S.lieferanten) if (!l.id) l.id = uid();
}
async function save() { await idbSet('state', S); }

/* ---------- Hilfen ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (n) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(n || 0);
const num = (v) => { if (typeof v === 'number') return v; const s = String(v || '').trim().replace(/\s/g, ''); if (!s) return 0; const n = s.includes(',') ? parseFloat(s.replace(/\./g, '').replace(',', '.')) : parseFloat(s); return isFinite(n) ? n : 0; };
const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const heute = () => iso(new Date());
const iso = (d) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const plusTage = (isoD, t) => { const d = new Date(isoD + 'T12:00:00'); d.setDate(d.getDate() + t); return iso(d); };
const dat = (isoD) => isoD ? new Date(isoD + 'T12:00:00').toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '–';
const tageBis = (isoD) => Math.round((new Date(isoD + 'T12:00:00') - new Date(heute() + 'T12:00:00')) / 86400000);
const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
const ku = () => !!S.firma.kleinunternehmer;

function summen(doc) {
  if (doc.extern) {
    const netto = num(doc.netto), ust = num(doc.ust);
    return { netto, ust, brutto: r2(netto + ust), proSatz: {} };
  }
  let netto = 0; const proSatz = {};
  for (const p of doc.positionen || []) {
    const n = r2(num(p.menge) * num(p.preis));
    netto += n;
    const satz = doc.ku || doc.rc ? 0 : num(p.ust);
    proSatz[satz] = (proSatz[satz] || 0) + n;
  }
  let ust = 0;
  for (const s in proSatz) ust += r2(proSatz[s] * Number(s) / 100);
  netto = r2(netto); ust = r2(ust);
  return { netto, ust, brutto: r2(netto + ust), proSatz };
}

function naechsteNr(art, jahr) {
  S.zaehler[art] = S.zaehler[art] || {};
  const n = (S.zaehler[art][jahr] || 0) + 1;
  S.zaehler[art][jahr] = n;
  return art + '-' + jahr + '-' + String(n).padStart(art === 'RE' ? 4 : 3, '0');
}

function reStatus(r) {
  if (r.typ === 'gutschrift') return { k: 'storno', t: 'Stornorechnung', c: 'grey' };
  if (r.status === 'entwurf') return { k: 'entwurf', t: 'Entwurf', c: 'grey' };
  if (r.status === 'storniert') return { k: 'storniert', t: 'Storniert', c: 'grey' };
  if (r.status === 'bezahlt') return { k: 'bezahlt', t: 'Bezahlt', c: 'good' };
  if (r.faellig && tageBis(r.faellig) < 0) return { k: 'ueberfaellig', t: 'Überfällig seit ' + (-tageBis(r.faellig)) + ' T.', c: 'bad' };
  return { k: 'offen', t: r.faellig ? 'Offen, fällig ' + dat(r.faellig) : 'Offen', c: 'warn' };
}
function anStatus(a) {
  if (a.status === 'abgerechnet') return { k: 'abgerechnet', t: 'In Rechnung', c: 'good' };

  if (a.gueltigBis && tageBis(a.gueltigBis) < 0) return { k: 'abgelaufen', t: 'Abgelaufen', c: 'grey' };
  return { k: 'offen', t: a.gueltigBis ? 'Offen bis ' + dat(a.gueltigBis) : 'Offen', c: 'warn' };
}
const zaehlt = (r) => r.status !== 'entwurf';

/* Umsatzsteuer-Zeitraum: letzter abgeschlossener Monat/Quartal, dessen Frist noch kommt und der nicht abgegeben ist */
function ustZeitraum() {
  let z = zrAus(zrRel(-1));
  if (tageBis(z.frist) < 0 || S.steuer.erledigt['ustva-' + z.key]) z = zrAus(zrRel(0));
  const u = ustva(z);
  return Object.assign(z, { ust: u.ust, vst: u.vst, zahl: u.zahl });
}

/* ---------- Steuern: UStVA, ZM, Gewinn, Schätzung, Fristen ---------- */
/* Steuerfall einer Rechnung ohne deutsche USt (Feld rc) und wohin sie in der Voranmeldung gehört */
const RC = {
  'eu-leistung': { t: 'Dienstleistung an Firma in der EU (Reverse Charge)', kz: '21', zm: 'S', idPflicht: true, xml: 'AE', hinweis: 'Steuerschuldnerschaft des Leistungsempfängers (Reverse Charge).' },
  'eu-lieferung': { t: 'Warenlieferung an Firma in der EU', kz: '41', zm: 'L', idPflicht: true, xml: 'K', hinweis: 'Steuerfreie innergemeinschaftliche Lieferung.' },
  inland13b: { t: 'Inland, Kunde schuldet die Steuer (§ 13b, z. B. Bauleistung)', kz: '60', xml: 'AE', hinweis: 'Steuerschuldnerschaft des Leistungsempfängers (§ 13b UStG).' },
  drittland: { t: 'Dienstleistung an Kunden außerhalb der EU', kz: '45', xml: 'O', hinweis: 'Nicht im Inland steuerbare Leistung.' },
  ausfuhr: { t: 'Warenlieferung in ein Land außerhalb der EU', kz: '43', xml: 'G', hinweis: 'Steuerfreie Ausfuhrlieferung.' }
};
const rcArt = (r) => (r.rc === true ? 'eu-leistung' : RC[r.rc] ? r.rc : '');
const BILANZ = ['ek', 'ohg', 'ug', 'gmbh'];
const KAPITAL = ['ug', 'gmbh'];
let stZr = '', stJahr = 0;

/* Fristen verschieben sich auf den nächsten Werktag (Wochenende, bundesweite Feiertage) */
function feiertage(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const ostern = iso(new Date(y, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1));
  return [`${y}-01-01`, `${y}-05-01`, `${y}-10-03`, `${y}-12-25`, `${y}-12-26`].concat([-2, 1, 39, 50].map((t) => plusTage(ostern, t)));
}
function werktag(isoD) {
  let d = isoD;
  for (;;) { const wd = new Date(d + 'T12:00:00').getDay(); if (wd !== 0 && wd !== 6 && !feiertage(+d.slice(0, 4)).includes(d)) return d; d = plusTage(d, 1); }
}

/* Voranmeldungszeiträume: Schlüssel 2026-09 (Monat) oder 2026-Q3 (Quartal) */
function zrRel(n) {
  const d = new Date(heute() + 'T12:00:00');
  if (S.firma.turnus === 'quartal') { let q = d.getFullYear() * 4 + Math.floor(d.getMonth() / 3) + n; return `${Math.floor(q / 4)}-Q${(q % 4) + 1}`; }
  const m = d.getFullYear() * 12 + d.getMonth() + n;
  return `${Math.floor(m / 12)}-${String((m % 12) + 1).padStart(2, '0')}`;
}
function zrAus(key) {
  const [ys, p] = key.split('-'), y = Number(ys);
  let von, bis, name;
  if (p[0] === 'Q') { const q = Number(p[1]) - 1; von = new Date(y, q * 3, 1); bis = new Date(y, q * 3 + 3, 0); name = `${q + 1}. Quartal ${y}`; }
  else { const m = Number(p) - 1; von = new Date(y, m, 1); bis = new Date(y, m + 1, 0); name = MONATE[m] + ' ' + y; }
  const frist = werktag(iso(new Date(bis.getFullYear(), bis.getMonth() + 1 + (S.firma.dauerfrist ? 1 : 0), 10)));
  return { key, von: iso(von), bis: iso(bis), name, frist, dez: p === '12' };
}

/* Umsatzsteuer für einen Zeitraum, aufgeteilt auf die ELSTER-Kennzahlen */
function ustva(z) {
  const ist = S.steuer.versteuerung === 'ist';
  const b = { 81: 0, 86: 0, 41: 0, 43: 0, 21: 0, 45: 0, 60: 0, 46: 0, 52: 0 };
  const warn = []; let vst = 0, frei = 0, n = 0;
  const drin = (d) => d && d >= z.von && d <= z.bis;
  for (const r of S.rechnungen) {
    if (!zaehlt(r) || r.ku) continue;
    let tag = r.datum;
    if (ist) {
      if (r.typ === 'gutschrift') { const o = S.rechnungen.find((x) => x.id === r.stornoVon); if (!o || !o.bezahltAm) continue; }
      else { if (!r.bezahltAm) continue; tag = r.bezahltAm; }
    }
    if (!drin(tag)) continue;
    n++;
    const s = summen(r), art = rcArt(r);
    if (art) { b[RC[art].kz] += s.netto; continue; }
    const teile = r.extern ? { [s.netto ? Math.round(s.ust / s.netto * 100) : 0]: s.netto } : s.proSatz;
    for (const k in teile) {
      if (Number(k) === 19) b[81] += teile[k];
      else if (Number(k) === 7) b[86] += teile[k];
      else if (teile[k]) { frei += teile[k]; warn.push(`${esc(r.nr || 'Rechnung')}: ${eur(teile[k])} mit ${k} % USt ohne Steuerfall, nicht eingerechnet. Steuerfall in der Rechnung angeben oder mit dem Steuerberater klären.`); }
    }
  }
  for (const be of S.belege) {
    if (!drin(be.datum)) continue;
    n++;
    if (be.rc === 'eu') b[46] += num(be.brutto);
    else if (be.rc === 'welt') b[52] += num(be.brutto);
    else if (!ku()) vst += num(be.vorsteuer);
    if (!num(be.brutto)) warn.push(`Beleg ${esc(be.lieferant || 'ohne Lieferant')} vom ${dat(be.datum)} hat keinen Betrag.`);
  }
  const ganz = (x) => Math.trunc(r2(x));
  const bas = {}; for (const k in b) bas[k] = ganz(b[k]);
  const st = { 81: r2(bas[81] * 0.19), 86: r2(bas[86] * 0.07), 47: r2(bas[46] * 0.19), 53: r2(bas[52] * 0.19) };
  const v67 = ku() ? 0 : r2(st[47] + st[53]);
  const svz = z.dez && S.firma.turnus !== 'quartal' && S.firma.dauerfrist ? r2(num(S.steuer.svz)) : 0;
  const ust = r2(st[81] + st[86] + st[47] + st[53]);
  vst = r2(vst);
  const zahl = r2(ust - vst - v67 - svz);
  const rows = [
    ['81', 'Umsätze zu 19 %', bas[81], `Steuer ${eur(st[81])} rechnet ELSTER selbst`, true],
    ['86', 'Umsätze zu 7 %', bas[86], `Steuer ${eur(st[86])} rechnet ELSTER selbst`],
    ['41', 'Warenlieferungen an Firmen in der EU (mit USt-IdNr.)', bas[41]],
    ['43', 'Steuerfreie Ausfuhrlieferungen (außerhalb der EU)', bas[43]],
    ['21', 'Dienstleistungen an Firmen in der EU (Reverse Charge)', bas[21]],
    ['45', 'Übrige nicht steuerbare Umsätze (Leistung im Ausland)', bas[45]],
    ['60', 'Umsätze, bei denen der Kunde die Steuer schuldet (§ 13b)', bas[60]],
    ['46', 'Einkauf von Leistungen bei Firmen aus der EU ohne USt (z. B. Google, Meta)', bas[46]],
    ['47', 'Steuer darauf, die du selbst schuldest', st[47], '', false, true],
    ['52', 'Einkauf anderer Leistungen nach § 13b (z. B. Firmen außerhalb der EU)', bas[52]],
    ['53', 'Steuer darauf, die du selbst schuldest', st[53], '', false, true],
    ['66', 'Vorsteuer aus Rechnungen anderer Firmen', vst, '', true, true],
    ['67', 'Vorsteuer aus den Einkäufen nach § 13b', v67, '', false, true],
    ['39', 'Abzug der Sondervorauszahlung', svz, 'nur in der Dezember-Anmeldung', false, true],
    ['83', zahl < 0 ? 'Ergebnis: Erstattung vom Finanzamt' : 'Ergebnis: an das Finanzamt zu zahlen', zahl, '', true, true]
  ].filter((x) => x[2] || x[4]).map(([kz, t, wert, info, , cent]) => ({ kz, t, wert, info: info || '', cent: !!cent }));
  return { z, rows, ust, vst: r2(vst + v67 + svz), zahl, n, warn, frei, nurRc: ku() && (bas[46] || bas[52]) };
}
const kzWert = (row) => row.cent ? row.wert.toFixed(2).replace('.', ',') : String(row.wert);
function kzTabelle(rows) {
  return `<table class="tab">${rows.map((x) => `<tr${x.kz === '83' ? ' style="font-weight:700"' : ''}><td style="white-space:nowrap">Kz ${x.kz}</td><td>${x.t}${x.info ? `<div class="small muted">${x.info}</div>` : ''}</td><td style="text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums">${x.cent ? eur(x.wert) : x.wert.toLocaleString('de-DE') + ' €'}</td><td style="text-align:right"><button class="chip" data-act="st-copy" data-k="${kzWert(x)}" aria-label="Wert für Kz ${x.kz} kopieren">Kopieren</button></td></tr>`).join('')}</table>`;
}

/* Zusammenfassende Meldung: EU-Geschäfte je Kunde und Quartal */
function zm(von, bis) {
  const m = {};
  for (const r of S.rechnungen) {
    const art = rcArt(r);
    if (!zaehlt(r) || !art || !RC[art].zm || !(r.datum >= von && r.datum <= bis)) continue;
    const id = String((r.kunde && r.kunde.ustid) || '').replace(/\s/g, '').toUpperCase();
    const k = id + '|' + RC[art].zm;
    m[k] = m[k] || { land: id.slice(0, 2), nr: id.slice(2), name: r.kunde.name, art: RC[art].zm, betrag: 0 };
    m[k].betrag += summen(r).netto;
  }
  return Object.values(m).map((x) => Object.assign(x, { betrag: Math.trunc(r2(x.betrag)) }));
}

/* Gewinn: EÜR nach Zahlungseingang, bei Bilanz-Rechtsformen GuV-Vorschau nach Rechnungsdatum */
function gewinn(jahr) {
  const bilanz = BILANZ.includes(S.firma.rechtsform), j = String(jahr);
  let ein = 0, offen = 0, nOffen = 0;
  for (const r of S.rechnungen) {
    if (!zaehlt(r)) continue;
    const s = summen(r);
    let tag = r.datum;
    if (!bilanz) {
      if (r.typ === 'gutschrift') { const o = S.rechnungen.find((x) => x.id === r.stornoVon); tag = o && o.bezahltAm ? r.datum : ''; }
      else tag = r.bezahltAm || '';
    }
    if (tag.startsWith(j)) ein += s.netto;
    if ((r.datum || '').startsWith(j) && r.typ !== 'gutschrift' && ['offen', 'ueberfaellig'].includes(reStatus(r).k)) { offen += s.brutto; nOffen++; }
  }
  const kat = {}, gross = [], ohne = [];
  let aus = 0, bewirt = 0;
  for (const b of S.belege) {
    if (!(b.datum || '').startsWith(j)) continue;
    const netto = r2(num(b.brutto) - num(b.vorsteuer));
    if (!num(b.brutto)) ohne.push(b);
    const k = b.kategorie || 'Ohne Kategorie';
    kat[k] = r2((kat[k] || 0) + netto);
    aus += netto;
    if (k === 'Bewirtung') bewirt += netto;
    if (netto > 800 && !['Miete', 'Versicherung', 'Fremdleistung', 'Werbung', 'Telefon und Internet', 'Wareneinkauf'].includes(k)) gross.push(b);
  }
  const nichtAbz = r2(bewirt * 0.3);
  ein = r2(ein); aus = r2(aus);
  return { bilanz, ein, aus, nichtAbz, gewinn: r2(ein - aus + nichtAbz), kat, gross, ohne, offen: r2(offen), nOffen };
}

/* Grobe Steuerschätzung. Tarif nach § 32a EStG, Grundtabelle (ledig), ohne andere Einkünfte und Abzüge */
const EST_TARIF = {
  2025: { g: [12096, 17443, 68480, 277825], a: 932.30, b: 176.64, c: 1015.13, d: 10911.92, e: 19246.67, soli: 19950 },
  2026: { g: [12348, 17799, 69878, 277825], a: 914.51, b: 173.10, c: 1034.87, d: 11135.63, e: 19470.38, soli: 20350 }
};
function estTarif(zve, jahr) {
  const t = EST_TARIF[Math.min(Math.max(jahr, 2025), 2026)], x = Math.floor(Math.max(0, zve));
  let est;
  if (x <= t.g[0]) est = 0;
  else if (x <= t.g[1]) { const y = (x - t.g[0]) / 10000; est = (t.a * y + 1400) * y; }
  else if (x <= t.g[2]) { const z = (x - t.g[1]) / 10000; est = (t.b * z + 2397) * z + t.c; }
  else if (x <= t.g[3]) est = 0.42 * x - t.d;
  else est = 0.45 * x - t.e;
  return { est: Math.floor(est), soliGrenze: t.soli };
}
function schaetzung(jahr, gw) {
  const rf = S.firma.rechtsform, g = Math.max(0, gw), z = [];
  const hebe = num(S.steuer.hebesatz) || 400;
  const gewerbe = rf && rf !== 'freiberufler';
  const freibetrag = KAPITAL.includes(rf) ? 0 : 24500;
  const mess = gewerbe ? Math.floor(Math.max(0, Math.floor(g / 100) * 100 - freibetrag) * 0.035) : 0;
  const gewst = r2(mess * hebe / 100);
  if (gewerbe) z.push(['Gewerbesteuer', gewst, `Hebesatz ${hebe} %${freibetrag ? ', nach Freibetrag 24.500 €' : ''}`]);
  if (KAPITAL.includes(rf)) {
    const kst = r2(g * 0.15);
    z.push(['Körperschaftsteuer (15 %)', kst, '']);
    z.push(['Solidaritätszuschlag', r2(kst * 0.055), '5,5 % der Körperschaftsteuer']);
  } else if (['einzel', 'freiberufler', 'ek', ''].includes(rf || '')) {
    const t = estTarif(g, jahr);
    const anr = gewerbe ? Math.min(r2(mess * 4), gewst, t.est) : 0;
    const est = Math.max(0, r2(t.est - anr));
    const soli = est > t.soliGrenze ? r2(Math.min(est * 0.055, (est - t.soliGrenze) * 0.119)) : 0;
    z.push(['Einkommensteuer', est, `ledig, ohne andere Einkünfte${anr ? `, nach Anrechnung der Gewerbesteuer (${eur(anr)})` : ''}`]);
    if (soli) z.push(['Solidaritätszuschlag', soli, '']);
  }
  const summe = r2(z.reduce((a, x) => a + x[1], 0));
  return { zeilen: z, summe, quote: g ? Math.round(summe / g * 100) : 0, personen: ['gbr', 'ohg'].includes(rf) };
}

/* Abgabefrist der Jahreserklärungen */
function jahresFrist(j) {
  if (S.steuer.berater) return werktag(j === 2024 ? '2026-04-30' : j === 2025 ? '2027-03-31' : iso(new Date(j + 2, 2, 0)));
  return werktag(j === 2023 ? '2024-09-02' : `${j + 1}-07-31`);
}

/* Fristen der nächsten gut 12 Monate, dazu überfällige Voranmeldungen mit Daten */
function fristen() {
  const out = [], h = heute(), y0 = Number(h.slice(0, 4)), rf = S.firma.rechtsform, E = S.steuer.erledigt || {};
  const bis = plusTage(h, 400);
  const add = (datum, key, t, s, mitDaten) => {
    datum = werktag(datum);
    if (datum > bis || (datum < h && (E[key] || !mitDaten))) return;
    out.push({ datum, key, t, s, erledigt: !!E[key] });
  };
  const d = (y, m, t) => `${y}-${String(m).padStart(2, '0')}-${String(t).padStart(2, '0')}`;
  for (let n = -4; n <= 13; n++) {
    const z = zrAus(zrRel(n));
    if (z.bis >= h) { if (!ku()) add(z.frist, 'ustva-' + z.key, `Umsatzsteuer-Voranmeldung ${z.name}`, 'Abgeben und zahlen. Die Werte stehen im Reiter Steuern.', false); continue; }
    const u = ustva(z);
    if (!ku() || u.nurRc) add(z.frist, 'ustva-' + z.key, `Umsatzsteuer-Voranmeldung ${z.name}`, `${u.zahl < 0 ? 'Erstattung' : 'Zahllast'} ${eur(Math.abs(u.zahl))}. Abgeben und zahlen.`, u.n > 0);
  }
  if (S.rechnungen.some((r) => RC[rcArt(r)] && RC[rcArt(r)].zm)) {
    const q0 = y0 * 4 + Math.floor((Number(h.slice(5, 7)) - 1) / 3);
    for (let q = q0 - 2; q <= q0 + 3; q++) {
      const y = Math.floor(q / 4), qi = q % 4;
      const von = d(y, qi * 3 + 1, 1), ende = iso(new Date(y, qi * 3 + 3, 0));
      const nd = new Date(y, qi * 3 + 3, 25);
      add(iso(nd), `zm-${y}-Q${qi + 1}`, `Zusammenfassende Meldung ${qi + 1}. Quartal ${y}`, 'EU-Geschäfte an das Bundeszentralamt für Steuern melden (BZSt-Online-Portal).', zm(von, ende).length > 0);
    }
  }
  for (const y of [y0, y0 + 1]) {
    if (!ku() && S.firma.dauerfrist && S.firma.turnus !== 'quartal') add(d(y, 2, 10), 'svz-' + y, `Sondervorauszahlung Umsatzsteuer ${y}`, 'Ein Elftel der Vorjahres-Zahllast, wegen der Dauerfristverlängerung.');
    if (num(S.steuer.vzEst)) for (const m of [3, 6, 9, 12]) add(d(y, m, 10), `vz-${y}-${m}`, `${KAPITAL.includes(rf) ? 'Körperschaftsteuer' : 'Einkommensteuer'}-Vorauszahlung ${eur(num(S.steuer.vzEst))}`, 'Laut Vorauszahlungsbescheid des Finanzamts.');
    if (num(S.steuer.vzGew)) for (const m of [2, 5, 8, 11]) add(d(y, m, 15), `gv-${y}-${m}`, `Gewerbesteuer-Vorauszahlung ${eur(num(S.steuer.vzGew))}`, 'Laut Bescheid der Gemeinde.');
  }
  for (const j of [y0 - 2, y0 - 1]) {
    const f = jahresFrist(j);
    if (f >= h) add(f, 'jahr-' + j, `Steuererklärungen ${j} abgeben`, (rf ? RECHTSFORMEN[rf].jahr : 'Einkommensteuer, Umsatzsteuer, je nach Rechtsform Gewerbesteuer') + (S.steuer.berater ? '. Frist mit Steuerberater.' : '. Frist ohne Steuerberater.'));
  }
  if (KAPITAL.includes(rf) || rf === 'ohg') add(d(y0, 12, 31), 'offen-' + (y0 - 1), `Jahresabschluss ${y0 - 1} offenlegen`, 'Beim Unternehmensregister einreichen.');
  return out.sort((a, b) => a.datum.localeCompare(b.datum));
}

function vSteuern() {

  const qi = Math.floor((Number(z.bis.slice(5, 7)) - 1) / 3), qy = z.bis.slice(0, 4);

  const ustCard = !ku() || u.nurRc;
  return `

  <div class="status"><div class="big">${next ? `<span class="pill ${fz(next)}">${tage < 0 ? 'Überfällig' : tage <= 14 ? 'Bald fällig' : 'Nächste Frist'}</span> ${next.t}` : '<span class="pill good">Gut</span> Keine offenen Fristen'}</div>
  <p class="small muted" style="margin-top:6px">${next ? `Bis ${dat(next.datum)}${tage < 0 ? `, seit ${-tage} Tagen vorbei` : `, in ${tage} Tagen`}. ${next.s}` : 'Alle bekannten Fristen sind erledigt.'}</p></div>

  <div class="card"><h2>Einkommensteuererklärung ${y0 - 1} selbst machen</h2>
    <p class="small">Schritt für Schritt: Firma, Arbeitslohn, Vermietung, Kapitalerträge, Rente, Kinder, Versicherungen und mehr. Unterlagen hochladen und sammeln. Am Ende die Werte je ELSTER-Anlage mit Zeile zum Abtippen.</p>
    <div class="btns"><button class="primary" data-act="est-open">${S.est && S.est[y0 - 1] ? 'Weitermachen' : 'Starten'}</button></div></div>

async function saveSteuer() {
  const f = $('#stForm'); if (!f) return;
  S.steuer.versteuerung = f.elements.versteuerung.value;
  S.steuer.hebesatz = num(f.elements.hebesatz.value) || 400;
  for (const k of ['svz', 'vzEst', 'vzGew']) S.steuer[k] = num(f.elements[k].value);
  S.steuer.berater = f.elements.berater.checked;
  await save(); render();
  const d = $('#stForm'); if (d) d.closest('details').open = true;
  toast('Gespeichert');
}
const icsEsc = (s) => String(s).replace(/<[^>]+>/g, '').replace(/[\\;,]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
function stIcs() {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Steuer-Cockpit//DE', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Steuerfristen'];
  for (const f of fristen().filter((x) => !x.erledigt && x.datum >= heute())) {
    L.push('BEGIN:VEVENT', `UID:${f.key}@steuer-cockpit`, 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + f.datum.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + plusTage(f.datum, 1).replace(/-/g, ''),
      'SUMMARY:' + icsEsc(f.t), 'DESCRIPTION:' + icsEsc(f.s), 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(f.t), 'TRIGGER:-P3D', 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  download('steuerfristen.ics', L.join('\r\n') + '\r\n', 'text/calendar');
  toast('Kalender-Datei gespeichert. Öffnen, um die Termine zu übernehmen.');
}
function stCsv(key) {
  const u = ustva(zrAus(key)), f = S.firma;
  const q = (s) => '"' + String(s).replace(/<[^>]+>/g, '').replace(/"/g, '""') + '"';
  const L = [['Umsatzsteuer-Voranmeldung', u.z.name], ['Firma', f.name], ['Steuernummer', f.steuernr], ['Versteuerung', S.steuer.versteuerung === 'ist' ? 'Ist' : 'Soll'], [], ['Kennzahl', 'Bezeichnung', 'Wert']]
    .concat(u.rows.map((x) => ['Kz ' + x.kz, x.t, kzWert(x)]));
  download(`UStVA-${key}.csv`, '﻿' + L.map((r) => r.map(q).join(';')).join('\r\n'), 'text/csv');
}
function stZm(k) {
  const [y, qi] = k.split('-').map(Number);
  const L = zm(`${y}-${String(qi * 3 + 1).padStart(2, '0')}-01`, iso(new Date(y, qi * 3 + 3, 0)));
  const rows = [['Länderkennzeichen', 'USt-IdNr.', 'Betrag (EUR)', 'Art der Leistung', 'Kunde']].concat(L.map((x) => [x.land, x.nr, x.betrag, x.art, x.name]));
  download(`ZM-${y}-Q${qi + 1}.csv`, '﻿' + rows.map((r) => r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n'), 'text/csv');
}
function stPrint(key) {
  const u = ustva(zrAus(key)), f = S.firma;

  const alt = document.title; document.title = 'UStVA-' + key;
  window.print();
  setTimeout(() => { document.title = alt; }, 500);
}

// Spaltennamen aus Bank-Exporten (Qonto auf Deutsch, Englisch, Französisch; dazu übliche Namen anderer Banken)
const BANK_SPALTEN = {
  id: ['transaction id', 'transaktions-id', 'transaktions id', 'id de la transaction', 'id de transaction'],
  datum: ['settlement date', 'datum der abwicklung', 'abwicklungsdatum', 'date de règlement', 'buchungstag', 'buchungsdatum', 'operation date', 'datum des vorgangs', 'valuta', 'datum', 'date'],
  betrag: ['total amount (incl', 'gesamtbetrag (inkl', 'montant total (ttc', 'gesamtbetrag', 'betrag', 'amount', 'montant', 'umsatz'],
  gegenpartei: ['counterparty', 'gegenpartei', 'contrepartie', 'beguenstigter', 'begünstigter', 'empfänger', 'auftraggeber', 'name'],
  zweck: ['reference', 'referenz', 'référence', 'verwendungszweck', 'buchungstext', 'libellé', 'label', 'beschreibung'],
  seite: ['side', 'richtung', 'sens', 'soll/haben'],
  status: ['status', 'statut']
};
function csvZeilen(text) {
  text = text.replace(/^﻿/, '');
  const erste = text.split(/\r?\n/)[0] || '';
  const sep = [';', ',', '\t'].map((c) => [c, erste.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function bankDatum(s) {
  s = String(s || '').trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/); if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  return '';
}
function bankBetrag(s) {
  s = String(s || '').replace(/[−–]/g, '-').replace(/[^\d,.+-]/g, '');
  if (!/\d/.test(s)) return NaN;
  s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  const n = parseFloat(s); return isFinite(n) ? r2(n) : NaN;
}
const kurzHash = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };
function bankAusCsv(text) {
  const rows = csvZeilen(text).filter((r) => r.some((c) => c.trim()));
  if (rows.length < 2) throw new Error('In der Datei stehen keine Buchungen.');
  const kopf = rows[0].map((h) => h.trim().toLowerCase());
  const col = {}, belegt = new Set();
  for (const [f, worte] of Object.entries(BANK_SPALTEN)) {
    for (const w of worte) {
      const i = kopf.findIndex((h, j) => !belegt.has(j) && h.includes(w) && !(f === 'betrag' && /vat|mwst|ust\b|tva|excl|exkl|\bht\b|netto/.test(h) && !/inkl|incl|ttc/.test(h)));
      if (i >= 0) { col[f] = i; belegt.add(i); break; }
    }
  }
  if (col.datum == null || col.betrag == null) throw new Error('Spalten für Datum und Betrag nicht gefunden. Bitte den Konto-Export als CSV wählen.');
  const zelle = (r, f) => col[f] == null ? '' : String(r[col[f]] || '').trim();
  const out = [], zaehl = {}; let uebersprungen = 0;
  for (const r of rows.slice(1)) {
    const datum = bankDatum(zelle(r, 'datum')); let betrag = bankBetrag(zelle(r, 'betrag'));
    if (!datum || !isFinite(betrag) || /declin|reject|revers|pending|abgelehnt|storniert|ausstehend|refus|annul|en attente/i.test(zelle(r, 'status'))) { uebersprungen++; continue; }
    if (betrag > 0 && /debit|débit|soll|lastschrift|ausgang/i.test(zelle(r, 'seite'))) betrag = -betrag;
    const gegenpartei = zelle(r, 'gegenpartei'), zweck = zelle(r, 'zweck');
    let id = zelle(r, 'id') ? 'q:' + zelle(r, 'id') : '';
    if (!id) { const h = 'h:' + kurzHash([datum, betrag, gegenpartei, zweck].join('|')); zaehl[h] = (zaehl[h] || 0) + 1; id = h + '-' + zaehl[h]; }
    out.push({ id, datum, betrag, gegenpartei, zweck, belegId: null, rechnungId: null });
  }
  return { buchungen: out, uebersprungen };
}
function bankImport() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv,text/csv';
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    try {
      const { buchungen, uebersprungen } = bankAusCsv(await file.text());
      const da = new Set(S.bank.map((b) => b.id));
      const neu = buchungen.filter((b) => !da.has(b.id));
      S.bank.push(...neu); await save();
      filter.bank = 'zuordnen'; tab = 'bank'; render();
      const vorschl = neu.filter((b) => bankTreffer(b).length).length;
      toast(`${neu.length} neue Buchung${neu.length === 1 ? '' : 'en'}${buchungen.length - neu.length ? `, ${buchungen.length - neu.length} schon vorhanden` : ''}${uebersprungen ? `, ${uebersprungen} übersprungen` : ''}${vorschl ? `. ${vorschl} ${vorschl === 1 ? 'passt' : 'passen'} zu offenen Rechnungen.` : ''}`);
    } catch (e) { toast(e.message || 'Die Datei konnte nicht gelesen werden.'); }
  };

}
const offeneRe = () => S.rechnungen.filter((r) => r.typ !== 'gutschrift' && ['offen', 'ueberfaellig'].includes(reStatus(r).k));
// Offene Rechnungen, die zu einem Zahlungseingang passen: Rechnungsnummer im Verwendungszweck zählt mehr als gleicher Betrag
function bankTreffer(b) {
  if (b.betrag <= 0 || b.rechnungId) return [];
  const z = (b.zweck + ' ' + b.gegenpartei).toLowerCase();
  return offeneRe().map((r) => ({ r, p: (r.nr && z.includes(String(r.nr).toLowerCase()) ? 2 : 0) + (Math.abs(summen(r).brutto - b.betrag) < 0.01 ? 1 : 0) }))
    .filter((x) => x.p).sort((a, c) => c.p - a.p).map((x) => x.r);
}
const bankOffen = (b) => b.betrag > 0 ? !b.rechnungId : !b.belegId;

  const i = coll.findIndex((x) => x.id === d.id);

  if (d.ausAngebot && stellen) { const a = S.angebote.find((x) => x.id === d.ausAngebot); if (a) a.status = 'abgerechnet'; }
  await save();
  toast(stellen ? `Rechnung ${d.nr} gestellt` : 'Gespeichert');
  tab = d.typ === 'angebot' ? 'angebote' : 'rechnungen';
  if (stellen) vDetailRe(d.id); else closeDlg();
  render();
}

/* ---------- Zahlungserinnerung und Mahnungen ---------- */
const MAHN = [null,
  { t: 'Zahlungserinnerung', b: 'Zahlungserinnerung schreiben', frist: 7, gebuehr: 0 },
  { t: '1. Mahnung', b: '1. Mahnung schreiben', frist: 10, gebuehr: 5 },
  { t: 'Letzte Mahnung', b: 'Letzte Mahnung schreiben', frist: 7, gebuehr: 5 }];
const mahnStufe = (r) => (r.mahnungen || []).length;
const letzteMahnung = (r) => (r.mahnungen || [])[mahnStufe(r) - 1] || null;
/* Ist jetzt der nächste Mahnschritt dran? Erst nach Fälligkeit und nach Ablauf der letzten Frist. */
function mahnenFaellig(r) {
  if (reStatus(r).k !== 'ueberfaellig' || mahnStufe(r) >= 3) return false;
  const l = letzteMahnung(r); return !l || tageBis(l.frist) < 0;
}
const verzugTage = (r) => Math.max(0, -tageBis(r.faellig));
function mahnZinsen(r, firma) {
  const satz = num(S.firma.basiszins) + (firma ? 9 : 5);
  return { satz: r2(satz), tage: verzugTage(r), betrag: r2(summen(r).brutto * satz / 100 * verzugTage(r) / 365) };
}
function vMahnen(id) {
  const r = S.rechnungen.find((x) => x.id === id); if (!r) return;
  const stufe = Math.min(mahnStufe(r) + 1, 3), M = MAHN[stufe];
  const firma = !!r.kunde.ustid, z = mahnZinsen(r, firma);
  const hatPauschale = (r.mahnungen || []).some((x) => x.pauschale), hatZinsen = (r.mahnungen || []).some((x) => x.zinsen);
  openDlg(`${head(M.t + ' zu ' + esc(r.nr))}<form id="mahnForm" class="dlg-body" autocomplete="off" data-id="${r.id}" data-stufe="${stufe}">
    <p>${esc(r.kunde.name)} schuldet dir <b>${eur(summen(r).brutto)}</b>, fällig seit ${dat(r.faellig)} (${z.tage} Tage).${mahnStufe(r) ? ` Zuletzt: ${MAHN[mahnStufe(r)].t} vom ${dat(letzteMahnung(r).datum)}.` : ''}</p>
    <div class="grid2">
      <label>Neue Zahlungsfrist<input type="date" name="frist" value="${plusTage(heute(), M.frist)}"></label>
      <label>Mahngebühr €<input name="gebuehr" inputmode="decimal" value="${String(M.gebuehr).replace('.', ',')}"></label>
    </div>
    <label class="check" style="margin-top:10px"><input type="checkbox" name="b2b"${firma ? ' checked' : ''}> Kunde ist ein Unternehmen (kein Privatkunde)</label>
    <label class="check"><input type="checkbox" name="zinsen"${hatZinsen ? ' checked' : ''}> Verzugszinsen berechnen <span class="muted small" id="zinsInfo">(${String(z.satz).replace('.', ',')} % p. a., ${z.tage} Tage: ${eur(z.betrag)})</span></label>
    <label class="check"><input type="checkbox" name="pauschale"${firma && !hatPauschale ? '' : ' disabled'}> Verzugspauschale 40 € (${hatPauschale ? 'schon in einer früheren Mahnung berechnet' : 'nur bei Unternehmen'})</label>
    <details style="margin-top:10px"><summary>Was ist erlaubt?</summary><p class="small muted" style="margin-top:6px">Mit festem Zahlungsdatum auf der Rechnung ist der Kunde ab dem Folgetag in Verzug. Dann darfst du Verzugszinsen verlangen: 5 Prozentpunkte über dem Basiszinssatz bei Privatkunden, 9 bei Unternehmen. Unternehmen schulden zusätzlich einmalig 40 € Pauschale. Mahngebühren nur in Höhe der echten Kosten (Porto, Papier), üblich sind bis 5 €. Die erste Erinnerung ist meist kostenlos und freundlich. Mahngebühren und Zinsen sind kein Umsatz und ohne Umsatzsteuer.</p></details>
  </form>
  <div class="dlg-foot"><button data-act="open-re" data-id="${r.id}">Abbrechen</button><button class="primary" data-act="mahn-save" data-id="${r.id}">Speichern und drucken</button></div>`);
  const f = $('#mahnForm');
  f.addEventListener('change', () => {
    const b = f.elements.b2b.checked, zz = mahnZinsen(r, b);
    f.elements.pauschale.disabled = !b || hatPauschale; if (f.elements.pauschale.disabled) f.elements.pauschale.checked = false;
    $('#zinsInfo').textContent = `(${String(zz.satz).replace('.', ',')} % p. a., ${zz.tage} Tage: ${eur(zz.betrag)})`;
  });
}
async function saveMahnung(el) {
  const r = S.rechnungen.find((x) => x.id === el.dataset.id), f = $('#mahnForm');
  const b2b = f.elements.b2b.checked, z = mahnZinsen(r, b2b);
  const m = {
    stufe: Number(f.dataset.stufe), datum: heute(), frist: f.elements.frist.value || plusTage(heute(), 7),
    gebuehr: r2(num(f.elements.gebuehr.value)),
    zinsen: f.elements.zinsen.checked ? z.betrag : 0, zinsSatz: z.satz, zinsTage: z.tage,
    pauschale: f.elements.pauschale.checked && b2b && !(r.mahnungen || []).some((x) => x.pauschale) ? 40 : 0
  };
  r.mahnungen = (r.mahnungen || []).concat(m);
  await save(); vDetailRe(r.id); render(); toast(MAHN[m.stufe].t + ' gespeichert');
  druckMahnung(r, m);
}
function fussHtml() {
  const f = S.firma;
  return `<div class="fuss">${[[f.name, f.inhaber && gfLabel() + ': ' + f.inhaber, f.strasse, [f.plz, f.ort].join(' ')], [f.tel && 'Tel. ' + f.tel, f.email, f.steuernr && 'Steuernr. ' + f.steuernr, f.ustid && 'USt-IdNr. ' + f.ustid, REGISTER_RF.includes(f.rechtsform) && f.registernr && [f.registergericht, f.registernr].filter(Boolean).join(' ')], [f.bank, f.iban && 'IBAN ' + f.iban, f.bic && 'BIC ' + f.bic]].map((col) => `<div>${col.filter((x) => x && String(x).trim()).map(esc).join('<br>')}</div>`).join('')}</div>`;

function druckMahnung(r, m) {

  const absender = [f.name, f.strasse, [f.plz, f.ort].join(' ')].filter((x) => x && x.trim()).join(' · ');
  const frueher = (r.mahnungen || []).filter((x) => x !== m && x.stufe < m.stufe);
  /* Gebühren früherer Mahnungen bleiben offen und werden mitgeführt */
  const alt = frueher.reduce((a, x) => a + num(x.gebuehr) + num(x.pauschale), 0);
  const gesamt = r2(s.brutto + alt + num(m.gebuehr) + num(m.zinsen) + num(m.pauschale));
  const text = {
    1: `sicher ist es im Alltag untergegangen: Unsere Rechnung ${esc(r.nr)} vom ${dat(r.datum)} über ${eur(s.brutto)} war am ${dat(r.faellig)} fällig. Bis heute haben wir keinen Zahlungseingang festgestellt.</p><p>Bitte überweisen Sie den offenen Betrag bis zum <b>${dat(m.frist)}</b>. Falls Sie bereits gezahlt haben, betrachten Sie dieses Schreiben bitte als gegenstandslos.`,
    2: `leider konnten wir für unsere Rechnung ${esc(r.nr)} vom ${dat(r.datum)}, fällig am ${dat(r.faellig)}, trotz ${frueher.length ? 'unserer Zahlungserinnerung vom ' + dat(frueher[frueher.length - 1].datum) : 'Fälligkeit'} noch keinen Zahlungseingang feststellen. Sie befinden sich seit dem ${dat(plusTage(r.faellig, 1))} in Zahlungsverzug.</p><p>Bitte überweisen Sie den unten genannten Gesamtbetrag bis spätestens <b>${dat(m.frist)}</b>.`,
    3: `trotz ${frueher.length > 1 ? 'Zahlungserinnerung und Mahnung' : 'unserer Mahnung'} ist unsere Rechnung ${esc(r.nr)} vom ${dat(r.datum)}, fällig am ${dat(r.faellig)}, weiterhin unbezahlt.</p><p>Wir fordern Sie letztmalig auf, den unten genannten Gesamtbetrag bis zum <b>${dat(m.frist)}</b> zu überweisen. Geht die Zahlung bis dahin nicht ein, werden wir die Forderung ohne weitere Ankündigung gerichtlich geltend machen (gerichtliches Mahnverfahren). Die dadurch entstehenden Kosten gehen zu Ihren Lasten.`
  }[m.stufe];
  $('#druck').innerHTML = `
    <div class="kopf"><div><div class="absender">${esc(absender)}</div><div style="white-space:pre-line"><b>${esc(r.kunde.name)}</b>\n${esc(r.kunde.adresse)}</div></div>
    <table class="meta"><tr><td>Datum</td><td>${dat(m.datum)}</td></tr><tr><td>Rechnungsnr.</td><td><b>${esc(r.nr)}</b></td></tr><tr><td>Rechnungsdatum</td><td>${dat(r.datum)}</td></tr><tr><td>Fällig seit</td><td>${dat(r.faellig)}</td></tr></table></div>
    <h1>${M.t}</h1>
    <p>Sehr geehrte Damen und Herren,</p><p>${text}</p>
    <div class="sum"><div><span>Rechnungsbetrag</span><span>${eur(s.brutto)}</span></div>
    ${alt ? `<div><span>Gebühren aus früheren Mahnungen</span><span>${eur(alt)}</span></div>` : ''}
    ${num(m.gebuehr) ? `<div><span>Mahngebühr</span><span>${eur(m.gebuehr)}</span></div>` : ''}
    ${num(m.zinsen) ? `<div><span>Verzugszinsen ${String(m.zinsSatz).replace('.', ',')} % p. a. für ${m.zinsTage} Tage</span><span>${eur(m.zinsen)}</span></div>` : ''}
    ${num(m.pauschale) ? `<div><span>Verzugspauschale § 288 Abs. 5 BGB</span><span>${eur(m.pauschale)}</span></div>` : ''}
    <div class="g"><span>Offener Gesamtbetrag</span><span>${eur(gesamt)}</span></div></div>
    <p>${f.iban ? `Bitte überweisen Sie auf ${f.bank ? esc(f.bank) + ', ' : ''}IBAN ${esc(f.iban)}${f.bic ? ', BIC ' + esc(f.bic) : ''}, Verwendungszweck ${esc(r.nr)}.` : `Bitte geben Sie bei der Zahlung die Rechnungsnummer ${esc(r.nr)} an.`}</p>
    <p>Mit freundlichen Grüßen<br>${esc(f.inhaber || f.name)}</p>
    ${fussHtml()}`;
  const altT = document.title; document.title = (r.nr + '_' + M.t).replace(/[^\w-]+/g, '_');
  window.print();
  setTimeout(() => { document.title = altT; }, 500);

/* Zuordnung zur Bankbuchung (S.bank kommt aus dem Bank-Import) */
function bankAuswahl(b) {
  const bank = (S.bank || []).filter((x) => num(x.betrag) < 0 && (!x.belegId || x.belegId === b.id));
  if (!bank.length) return '';
  const br = num(b.brutto), passt = (x) => br && Math.abs(-num(x.betrag) - br) < 0.005;

  const sortiert = bank.sort((x, y) => (passt(y) - passt(x)) || abstand(x) - abstand(y)).slice(0, 40);
  return `<label class="full">Zahlung auf dem Konto<select name="buchungId"><option value="">Noch nicht zugeordnet</option>${sortiert.map((x) => `<option value="${esc(x.id)}"${x.id === b.buchungId ? ' selected' : ''}>${dat(x.datum)} · ${esc(x.gegenpartei || x.zweck || '')} · ${eur(num(x.betrag))}${passt(x) ? ' · Betrag passt' : ''}</option>`).join('')}</select></label>`;
}
function calcVst() {

async function storeFile(prefix) {

/* Eine Datei: Beleg-Dialog. Mehrere: je ein Beleg, Betrag und Kategorie werden danach ergänzt. */
async function dateienRein(liste) {
  let files = [...(liste || [])].filter((f) => f && f.size);
  const gross = files.filter((f) => f.size > 25e6);
  files = files.filter((f) => f.size <= 25e6);
  if (gross.length) toast(`${gross.length} Datei${gross.length > 1 ? 'en sind' : ' ist'} größer als 25 MB und wurde${gross.length > 1 ? 'n' : ''} übersprungen.`);
  if (!files.length) return;
  if (files.length === 1) { vBeleg(null); pendingFile = files[0]; zeigeDatei(files[0]); return; }
  for (const file of files) {
    pendingFile = file;
    const fi = await storeFile('b'), l = rateLieferant(file.name);
    S.belege.push(Object.assign({ id: uid(), datum: heute(), lieferant: l ? l.name : nameAusDatei(file.name), brutto: 0, ustSatz: 19, vorsteuer: '', kategorie: (l && l.kategorie) || '', rc: (l && l.rc) || '', notiz: '', zahlweg: 'konto', hochgeladen: heute() }, fi));

  pendingFile = null;
  await save(); closeDlg(); filter.be = 'fehlt'; tab = 'belege'; render(); window.scrollTo(0, 0);
  toast(`${files.length} Belege gespeichert. Ergänze jetzt Betrag und Kategorie.`);
}

/* ---------- E-Rechnung (XRechnung 3.0, UBL) ---------- */
function kundenAdresse(t) {
  const z = String(t || '').split('\n').map((l) => l.trim()).filter(Boolean);
  /* Letzte Zeile nur aus Buchstaben (z. B. „Österreich“) ist das Land, nicht der Ort */
  const landZeile = z.length > 2 && !/\d/.test(z[z.length - 1]) ? z.pop() : '';
  const last = z.length > 1 ? z[z.length - 1] : '';
  const m = last.match(/^(?:[A-Z]{1,3}-\s?)?(\d{4}\s?[A-Z]{2}|\d{2}-\d{3}|\d{3}\s?\d{2}|\d{4,6})\s+(.+)$/);
  return { strasse: z.length > 1 ? z.slice(0, -1).join(', ') : z[0] || '', plz: m ? m[1] : '', ort: m ? m[2] : last, landZeile };
}
/* Ländercode aus der USt-IdNr. (Griechenland nutzt dort EL statt GR) */
const ustLand = (id) => { const c = String(id || '').replace(/\s/g, '').slice(0, 2).toUpperCase(); return /^[A-Z]{2}$/.test(c) ? (c === 'EL' ? 'GR' : c) : ''; };
const kundenLand = (r) => (r.rc && r.rc !== 'inland13b' && (r.kunde.land || ustLand(r.kunde.ustid))) || 'DE';
/* Codes nach EN 16931 (VATEX) für die Steuerbefreiungsgründe */
const VATEX = { AE: 'VATEX-EU-AE', K: 'VATEX-EU-IC', G: 'VATEX-EU-G', O: 'VATEX-EU-O' };
/* Was die XRechnung zusätzlich zu § 14 UStG braucht, sonst lehnt das Prüfprogramm des Empfängers sie ab */
function eRechnungFehlt(r) {
  const f = S.firma, k = kundenAdresse(r.kunde.adresse), m = [];
  if (!f.email) m.push(['Deine E-Mail-Adresse', 'firma']);
  if (!f.tel || (f.tel.match(/\d/g) || []).length < 3) m.push(['Deine Telefonnummer', 'firma']);
  if (!f.strasse || !f.plz || !f.ort) m.push(['Deine vollständige Anschrift', 'firma']);
  if (!f.iban) m.push(['Deine IBAN (für die Zahlungsangaben)', 'firma']);
  if (!r.kunde.email) m.push(['E-Mail-Adresse des Kunden', 'kunde']);
  if (!k.plz || !k.ort) m.push(['Kundenanschrift mit PLZ und Ort in der letzten Zeile', 'kunde']);
  const kat = RC[r.rc] && !r.ku ? RC[r.rc].xml : '';
  /* BR-AE-2, BR-IC-2, BR-G-2: ohne deutsche USt braucht es deine USt-IdNr., bei AE und K auch die des Kunden */
  if (['AE', 'K', 'G'].includes(kat) && !f.ustid) m.push(['Deine USt-IdNr. (Pflicht bei diesem Steuerfall)', 'firma']);
  if (['AE', 'K'].includes(kat) && !r.kunde.ustid) m.push(['USt-IdNr. des Kunden (Pflicht bei diesem Steuerfall)', 'kunde']);
  if (r.rc && r.rc !== 'inland13b' && kundenLand(r) === 'DE') m.push(['Land des Kunden (nicht Deutschland)', 'kunde']);
  return m;
}

function xrechnung(r) {

        <cac:TaxCategory><cbc:ID>${kat(satz)}</cbc:ID>${satzEl(satz)}${befreiung}<cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:TaxCategory></cac:TaxSubtotal>`).join('');

    <cac:Item><cbc:Name>${x(p.text)}</cbc:Name><cac:ClassifiedTaxCategory><cbc:ID>${kat(num(p.ust))}</cbc:ID>${satzEl(r.ku ? 0 : num(p.ust))}<cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:ClassifiedTaxCategory></cac:Item>
    <cac:Price><cbc:PriceAmount currencyID="EUR">${a(num(p.preis))}</cbc:PriceAmount></cac:Price></cac:InvoiceLine>`).join('');
  const orig = r.stornoVon ? S.rechnungen.find((y) => y.id === r.stornoVon) : null;
  return `<?xml version="1.0" encoding="UTF-8"?>

  <cbc:DocumentCurrencyCode>EUR</cbc:DocumentCurrencyCode>

function download(name, text, type) {

  const aEl = document.createElement('a'); aEl.href = url; aEl.download = name; document.body.appendChild(aEl); aEl.click(); aEl.remove();

}

/* Logo auf höchstens 600 × 200 Pixel verkleinern und als Bild-Daten speichern */
function logoVerkleinern(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const w = img.naturalWidth || 600, h = img.naturalHeight || 200, z = Math.min(1, 600 / w, 200 / h);
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * z)); c.height = Math.max(1, Math.round(h * z));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bild nicht lesbar')); };
    img.src = url;
  });
}

/* Neue Version: beim Öffnen und alle 15 Minuten prüfen, dann neu laden (nicht mitten in einem offenen Dialog) */
const BUILD = '__BUILD__';
let updateWartet = false;
async function pruefeUpdate() {
  if (BUILD.startsWith('__')) return;
  try {
    const j = await (await fetch('version.json', { cache: 'no-store' })).json();
    if (!j.v || j.v === BUILD) return;
    // Schutz gegen Endlosschleife, falls noch eine alte Fassung zwischengespeichert ist
    try { if (sessionStorage.getItem('sc-update') === j.v) return; sessionStorage.setItem('sc-update', j.v); } catch (e) {}
    if (dlg.open) updateWartet = true; else location.reload();
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pruefeUpdate(); });
