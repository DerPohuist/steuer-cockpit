<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Steuer-Cockpit</title>
<style>
:root {
  --bg: #f3f5f8; --panel: #ffffff; --fg: #141a21; --muted: #5d6876; --line: #dbe0e6;
  --accent: #1f5fbf; --accent-fg: #ffffff; --soft: #eaf1fb;
  --ch-ein: #2a78d6; --ch-aus: #eb6834;
  --good: #1d7a46; --good-bg: #e5f4ea; --warn: #8a5a00; --warn-bg: #fdf1d8; --bad: #b3261e; --bad-bg: #fbe6e4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1720; --panel: #17212c; --fg: #e8edf2; --muted: #9aa6b3; --line: #29343f;
    --accent: #6ea2f2; --accent-fg: #0f1720; --soft: #1b2a3b;
    --ch-ein: #3987e5; --ch-aus: #d95926;
    --good: #6fcf97; --good-bg: #16302a; --warn: #f2c25b; --warn-bg: #362b13; --bad: #f08a80; --bad-bg: #3a1d1b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
[hidden] { display: none !important; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px; border-bottom: 1px solid var(--line); }
header.top .row { max-width: 860px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; color: var(--accent); }
.firm { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
main { max-width: 860px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.35rem; margin: 4px 0 12px; }
h2 { font-size: 1.05rem; margin: 0 0 8px; }
h3 { font-size: .95rem; margin: 14px 0 6px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.status { border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--line); background: var(--panel); }
.status .big { font-size: 1.25rem; font-weight: 700; }
.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.todo li:first-child { border-top: 0; padding-top: 0; }
.todo .dot { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; background: var(--muted); }
.dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); } .dot.good { background: var(--good); }
.todo .grow { flex: 1; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.tile .q { font-size: 13px; color: var(--muted); }
.tile .v { font-size: 1.2rem; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; }
.tile .e { font-size: 12.5px; color: var(--muted); }
.ch-titel { font-size: 14px; margin: 16px 0 6px; }
.ch-legende { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.ch-sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.ch-sw.ein, .ch-ein { background: var(--ch-ein); fill: var(--ch-ein); } .ch-sw.aus, .ch-aus { background: var(--ch-aus); fill: var(--ch-aus); }
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; overflow: visible; }
.chart .ch-grid { stroke: var(--line); stroke-width: 1; } .chart .ch-null { stroke: var(--muted); stroke-width: 1; }
.chart .ch-ax { fill: var(--muted); font-size: 12px; } .chart .ch-zukunft { opacity: .45; }
.chart .ch-wert { fill: var(--fg); font-size: 13px; font-weight: 700; }
.chart .ch-hl { fill: transparent; } .chart .ch-hl.on { fill: var(--soft); }
.chart .ch-hit { fill: transparent; cursor: pointer; }
.chart .ch-linie { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; }
.chart .ch-punkt { fill: var(--fg); stroke: var(--panel); stroke-width: 2; }
.ch-info { min-height: 2.6em; margin: 4px 0 0; color: var(--muted); } .ch-info b { color: var(--fg); }
.ch-kat { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ch-kat li { display: grid; grid-template-columns: minmax(0, 9.5em) 1fr auto; gap: 8px; align-items: center; font-size: 13.5px; }
.ch-kn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-kb i { display: block; height: 10px; border-radius: 0 4px 4px 0; background: var(--ch-aus); }
.ch-kv { font-variant-numeric: tabular-nums; text-align: right; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--accent); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.grey { background: var(--line); color: var(--muted); }
.bar { position: relative; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; margin: 6px 0 2px; }
.bar i { display: block; height: 100%; border-radius: 5px; background: var(--good); }
.bar i.warn { background: var(--warn); } .bar i.bad { background: var(--bad); }
.bar b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); opacity: .5; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.item { display: flex; gap: 10px; align-items: center; padding: 11px 2px; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { font-size: 13px; color: var(--muted); }
.item .amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button, .btn { font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-block; }
.btn.primary, button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger, button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: not-allowed; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); }
details { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 14px; }
label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
label.check { display: flex; gap: 8px; align-items: center; color: var(--fg); }
input, select, textarea { font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
label.check input { width: auto; }
textarea { min-height: 70px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 600px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.full { grid-column: 1 / -1; }
.pos { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
.pos .text { grid-column: 1 / -1; }
@media (min-width: 640px) { .pos { grid-template-columns: 3fr .8fr 1fr 1.1fr .9fr .8fr auto; align-items: end; } .pos .text { grid-column: auto; } }
.pos .sum { font-variant-numeric: tabular-nums; font-weight: 600; padding: 9px 0; }
.pos .del { padding: 8px 10px; }
.totals { margin-left: auto; max-width: 320px; font-variant-numeric: tabular-nums; }
.totals div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.totals .gross { font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 4px; }
.checks { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.checks li { padding: 2px 0; }
.checks li.ok::before { content: "✓ "; color: var(--good); font-weight: 700; }
.checks li.miss::before { content: "✗ "; color: var(--bad); font-weight: 700; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .row { max-width: 860px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); }
nav.tabs button { border: 0; border-radius: 0; background: none; padding: 9px 2px 10px; font-size: 12px; font-weight: 600; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 7; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); border: 0; font-size: 32px; line-height: 1; padding: 0; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
dialog { border: 0; padding: 0; background: var(--panel); color: var(--fg); width: 100%; max-width: 760px; max-height: 100%; border-radius: 14px; }
dialog::backdrop { background: rgba(0,0,0,.45); }
@media (max-width: 640px) { dialog { margin: auto 0 0; max-width: 100%; border-radius: 14px 14px 0 0; max-height: 94vh; } }
.dlg-head { position: sticky; top: 0; background: var(--panel); display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); z-index: 1; }
.dlg-head h2 { margin: 0; }
.dlg-body { padding: 16px; }
.dlg-foot { position: sticky; bottom: 0; background: var(--panel); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.x { border: 0; background: none; font-size: 26px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.menu { display: grid; gap: 10px; }
.menu button { display: flex; gap: 12px; align-items: center; text-align: left; padding: 14px; }
.menu .ic { font-size: 24px; width: 34px; text-align: center; }
.menu .t { display: block; font-weight: 700; }
.menu .s { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.preview { max-width: 100%; max-height: 260px; border-radius: 8px; border: 1px solid var(--line); display: block; margin-top: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 20; font-size: 14px; max-width: calc(100% - 32px); }
table.tab { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tab td, table.tab th { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.logo-prev { max-height: 64px; max-width: 220px; display: block; margin: 8px 0; background: #fff; border-radius: 6px; padding: 4px; border: 1px solid var(--line); }
.wiz .opts { display: grid; gap: 8px; margin-top: 10px; }
.wiz .opts button { text-align: left; font-weight: 500; }
.wiz .step { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.drop { border: 2px dashed var(--line); }
.drop.on { border-color: var(--accent); background: var(--soft); }
.upl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.upl button { display: grid; justify-items: center; gap: 2px; padding: 10px 4px; font-size: 13px; }
.upl .ic { font-size: 22px; line-height: 1.2; }
.hb { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 3px 10px 3px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--soft); color: var(--accent); cursor: pointer; vertical-align: middle; white-space: nowrap; }
.hb::before { content: "?"; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 12px; font-weight: 800; }
h2 .hb, h3 .hb { margin-left: 6px; }
.hilfe ol, .hilfe ul { margin: 4px 0 8px; padding-left: 22px; }
.hilfe li { margin: 0 0 6px; }
.hilfe ul.hl { list-style: none; padding-left: 0; }
.hilfe ul.hl a { color: var(--accent); font-weight: 600; }
.top-hilfe { border: 1px solid var(--line); background: var(--panel); color: var(--accent); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
#druck { display: none; }
@media print {
  @page { size: A4; margin: 18mm 16mm; }
  body { background: #fff; color: #000; padding: 0; }
  body > *:not(#druck) { display: none !important; }
  #druck { display: block; font-size: 10.5pt; color: #000; }
  #druck .absender { font-size: 8pt; text-decoration: underline; margin-bottom: 4mm; }
  #druck .kopf { display: flex; justify-content: space-between; gap: 10mm; margin-bottom: 12mm; }
  #druck .meta td { padding: 0 0 1mm 6mm; }
  #druck .logo { display: block; max-height: 22mm; max-width: 60mm; margin: 0 0 4mm auto; }
  #druck h1 { font-size: 16pt; margin: 0 0 6mm; }
  #druck table.p { width: 100%; border-collapse: collapse; margin: 4mm 0; }
  #druck table.p th, #druck table.p td { border-bottom: .3mm solid #999; padding: 2mm 1mm; text-align: left; }
  #druck table.p .r { text-align: right; }
  #druck .sum { margin-left: auto; width: 75mm; }
  #druck .sum div { display: flex; justify-content: space-between; padding: .8mm 0; }
  #druck .sum .g { font-weight: 700; border-top: .4mm solid #000; margin-top: 1mm; padding-top: 1.5mm; }
  #druck .fuss { margin-top: 14mm; font-size: 8.5pt; color: #333; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; border-top: .3mm solid #999; padding-top: 3mm; }
}
</style>

<body>
<header class="top"><div class="row"><span class="brand">Steuer-Cockpit</span><span style="display:flex;gap:10px;align-items:center;min-width:0"><span class="firm" id="firmname"></span><button class="top-hilfe" data-act="hilfe-liste" aria-label="Hilfe und Anleitungen">? Hilfe</button></span></div></header>
<main id="app"><p class="muted">Lädt …</p></main>
<button class="fab" id="fab" aria-label="Neu: Angebot, Rechnung oder Beleg" data-act="menu">+</button>
<nav class="tabs" aria-label="Bereiche"><div class="row" id="tabs"></div></nav>
<dialog id="dlg"></dialog>
<dialog id="hilfeDlg" aria-label="Hilfe"></dialog>
<div id="druck"></div>
<script>
(function () {
'use strict';

/* ---------- Speicher (IndexedDB, bleibt nur auf diesem Gerät) ---------- */
const DBN = 'steuer-cockpit', ST = 'kv';
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DBN, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(ST);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function kv(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(ST, mode), st = tx.objectStore(ST);
    const r = fn(st);
    tx.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
    tx.onerror = () => rej(tx.error);
  });
}
const idbGet = (k) => kv('readonly', (s) => s.get(k));
const idbSet = (k, v) => kv('readwrite', (s) => s.put(v, k));
const idbDel = (k) => kv('readwrite', (s) => s.delete(k));
const idbKeys = () => kv('readonly', (s) => s.getAllKeys());

/* ---------- Grunddaten ---------- */
const RECHTSFORMEN = {
  freiberufler: { label: 'Freiberufler', gewinn: 'EÜR (Einnahmen-Überschuss-Rechnung)', jahr: 'Einkommensteuer mit Anlage S und Anlage EÜR, Umsatzsteuer-Jahreserklärung', extra: 'Keine Gewerbesteuer.' },
  einzel: { label: 'Einzelunternehmen (Gewerbe)', gewinn: 'EÜR; Bilanz erst ab 800.000 € Umsatz oder 80.000 € Gewinn im Jahr', jahr: 'Einkommensteuer mit Anlage G und Anlage EÜR, Gewerbesteuer, Umsatzsteuer-Jahreserklärung', extra: 'Gewerbesteuer-Freibetrag 24.500 €.' },
  ek: { label: 'e.K. (eingetragener Kaufmann)', gewinn: 'Bilanz nach HGB, unter denselben Grenzen wie beim Einzelunternehmen befreit', jahr: 'Wie Einzelunternehmen, mit Bilanz zusätzlich E-Bilanz', extra: 'Eintrag im Handelsregister.' },
  gbr: { label: 'GbR / eGbR', gewinn: 'EÜR, solange nicht buchführungspflichtig', jahr: 'Feststellungserklärung, Gewerbesteuer wenn gewerblich, Umsatzsteuer; jeder Gesellschafter macht seine eigene Einkommensteuer', extra: 'Gewinn wird auf die Gesellschafter verteilt.' },
  ohg: { label: 'OHG / KG / GmbH & Co. KG', gewinn: 'Bilanz nach HGB', jahr: 'Feststellungserklärung, E-Bilanz, Gewerbesteuer, Umsatzsteuer', extra: 'Gewinnverteilung auf Gesellschafter, Kapitalkonten.' },
  ug: { label: 'UG (haftungsbeschränkt)', gewinn: 'Bilanz und GuV nach HGB', jahr: 'Körperschaftsteuer, Gewerbesteuer, Umsatzsteuer, E-Bilanz', extra: '25 % des Jahresüberschusses in die Rücklage; Jahresabschluss offenlegen.' },
  gmbh: { label: 'GmbH', gewinn: 'Bilanz und GuV nach HGB', jahr: 'Körperschaftsteuer, Gewerbesteuer, Umsatzsteuer, E-Bilanz', extra: 'Jahresabschluss offenlegen; Lohnsteuer für das Geschäftsführergehalt.' }
};
const KU_HINWEIS = 'Gemäß § 19 UStG wird keine Umsatzsteuer berechnet (Kleinunternehmerregelung).';
const KU_GRENZE = 100000, KU_VORJAHR = 25000;
const KATEGORIEN = ['Wareneinkauf', 'Büro und Software', 'Telefon und Internet', 'Fahrzeug und Reise', 'Werbung', 'Miete', 'Versicherung', 'Fremdleistung', 'Bewirtung', 'Porto und Versand', 'Bankgebühren', 'Fortbildung', 'Beiträge und Gebühren', 'Anschaffung (Gerät, Möbel)', 'Sonstiges'];
const ZAHLWEGE = [['konto', 'Geschäftskonto'], ['bar', 'Bar'], ['privat', 'Privat ausgelegt'], ['offen', 'Noch nicht bezahlt']];
const REGISTER_RF = ['ek', 'ohg', 'ug', 'gmbh'];

function leer() {
  return {
    v: 2,
    firma: { name: '', inhaber: '', strasse: '', plz: '', ort: '', steuernr: '', ustid: '', email: '', tel: '', iban: '', bic: '', bank: '', rechtsform: '', registergericht: '', registernr: '', logo: '', kleinunternehmer: false, gruendung: '', turnus: 'monat', dauerfrist: false, zahlungsziel: 14, angebotTage: 30, basiszins: 1.27, skontoProz: '', skontoTage: '', nummern: {} },
    angebote: [], rechnungen: [], belege: [], kunden: [], lieferanten: [], bank: [], vorlagen: [], artikel: [], lager: [], anlagen: [], zaehler: {}, letzteSicherung: null,
    steuer: { versteuerung: 'soll', hebesatz: 400, berater: false, svz: 0, vzEst: 0, vzGew: 0, erledigt: {}, ruecklageIst: '', kalVorher: 3, kalRe: true, skr: '03', beraterNr: '', mandantNr: '' },
    est: {}, modus: ''
  };
}
let S = leer();
const privat = () => S.modus === 'privat';
let tab = 'start', filter = {};

async function load() {
  const s = await idbGet('state');
  if (s) S = Object.assign(leer(), s, { firma: Object.assign(leer().firma, s.firma || {}), steuer: Object.assign(leer().steuer, s.steuer || {}) });
  migriere();
}
/* Ältere Stände: Kunden bekommen eine id, Lieferanten entstehen aus vorhandenen Belegen */
function migriere() {
  S.kunden = S.kunden || []; S.lieferanten = S.lieferanten || []; S.vorlagen = S.vorlagen || []; S.artikel = S.artikel || []; S.lager = S.lager || []; S.anlagen = S.anlagen || []; S.firma.nummern = S.firma.nummern || {};

/* Gewinn: EÜR nach Zahlungseingang, bei Bilanz-Rechtsformen GuV-Vorschau nach Rechnungsdatum */
function gewinn(jahr) {
  const bilanz = BILANZ.includes(S.firma.rechtsform), j = String(jahr);
  let ein = 0, offen = 0, nOffen = 0;
  const mEin = Array(12).fill(0), mAus = Array(12).fill(0), mon = (d) => Number(d.slice(5, 7)) - 1;
  for (const r of S.rechnungen) {
    if (!zaehlt(r)) continue;
    const s = summen(r);
    let st;
    // Bilanz: Abschläge sind noch kein Ertrag, die Schlussrechnung zählt voll
    if (bilanz) st = r.art === 'abschlag' ? [] : [[r.datum, istSchluss(r) && s.netto ? summenVoll(r).netto / s.netto : 1]].concat(anteile(r, true).map((a) => [a.datum, -a.f]));
    else if (r.typ === 'gutschrift') { const o = S.rechnungen.find((x) => x.id === r.stornoVon); st = o && hatZahlung(o) ? [[r.datum, 1]] : []; }
    else st = anteile(r, false).map((a) => [a.datum, a.f]);
    for (const [tag, f] of st) if ((tag || '').startsWith(j)) { ein += s.netto * f; mEin[mon(tag)] += s.netto * f; }
    if ((r.datum || '').startsWith(j) && r.typ !== 'gutschrift' && ['offen', 'ueberfaellig'].includes(reStatus(r).k)) { offen += offenBetrag(r); nOffen++; }
  }
  const kat = {}, mKat = {}, gross = [], ohne = [];
  let aus = 0, bewirt = 0;
  for (const b of S.belege) {
    if (!(b.datum || '').startsWith(j)) continue;
    if (anlageVon(b)) continue;
    const netto = r2(num(b.brutto) - num(b.vorsteuer));
    if (!num(b.brutto)) ohne.push(b);
    const k = b.kategorie || 'Ohne Kategorie';
    kat[k] = r2((kat[k] || 0) + netto);
    (mKat[k] = mKat[k] || Array(12).fill(0))[mon(b.datum)] += netto;
    aus += netto; mAus[mon(b.datum)] += netto;
    if (k === 'Bewirtung') bewirt += netto;
    if (netto > 800 && !['Miete', 'Versicherung', 'Fremdleistung', 'Werbung', 'Telefon und Internet', 'Wareneinkauf'].includes(k)) gross.push(b);
  }
  // Abschreibung aus dem Anlagenverzeichnis, verteilt auf die Monate, in denen das Gerät im Jahr genutzt wird
  let afa = 0;
  for (const a of S.anlagen) {
    const x = afaJahr(a, Number(j)); if (!x.afa && !x.rest) continue;
    const m = x.von - 1, bisM = Math.round(num(a.jahre)) <= 1 ? m : x.bis - 1, n = bisM - m + 1, mk = mKat.Abschreibung = mKat.Abschreibung || Array(12).fill(0);
    for (let i = m; i <= bisM; i++) { const t = i === bisM ? r2(x.afa - r2(x.afa / n) * (n - 1)) : r2(x.afa / n); mk[i] += t; mAus[i] += t; }
    if (x.rest) { mk[bisM] += x.rest; mAus[bisM] += x.rest; }
    afa += x.afa + x.rest;
  }
  afa = r2(afa);
  if (afa) { kat.Abschreibung = afa; aus += afa; }
  const nichtAbz = r2(bewirt * 0.3);
  ein = r2(ein); aus = r2(aus);
  return { bilanz, ein, aus, nichtAbz, gewinn: r2(ein - aus + nichtAbz), kat, mKat, afa, gross, ohne, offen: r2(offen), nOffen, mEin: mEin.map(r2), mAus: mAus.map(r2) };
}

/* Grobe Steuerschätzung. Tarif nach § 32a EStG, Grundtabelle (ledig), ohne andere Einkünfte und Abzüge */
const EST_TARIF = {
  2025: { g: [12096, 17443, 68480, 277825], a: 932.30, b: 176.64, c: 1015.13, d: 10911.92, e: 19246.67, soli: 19950 },
  2026: { g: [12348, 17799, 69878, 277825], a: 914.51, b: 173.10, c: 1034.87, d: 11135.63, e: 19470.38, soli: 20350 }
};
function estTarif(zve, jahr) {
  const t = EST_TARIF[Math.min(Math.max(jahr, 2025), 2026)], x = Math.floor(Math.max(0, zve));
  let est;
  if (x <= t.g[0]) est = 0;
  else if (x <= t.g[1]) { const y = (x - t.g[0]) / 10000; est = (t.a * y + 1400) * y; }
  else if (x <= t.g[2]) { const z = (x - t.g[1]) / 10000; est = (t.b * z + 2397) * z + t.c; }
  else if (x <= t.g[3]) est = 0.42 * x - t.d;
  else est = 0.45 * x - t.e;
  return { est: Math.floor(est), soliGrenze: t.soli };
}
function schaetzung(jahr, gw) {
  const rf = S.firma.rechtsform, g = Math.max(0, gw), z = [];
  const hebe = num(S.steuer.hebesatz) || 400;
  const gewerbe = rf && rf !== 'freiberufler';
  const freibetrag = KAPITAL.includes(rf) ? 0 : 24500;
  const mess = gewerbe ? Math.floor(Math.max(0, Math.floor(g / 100) * 100 - freibetrag) * 0.035) : 0;
  const gewst = r2(mess * hebe / 100);
  if (gewerbe) z.push(['Gewerbesteuer', gewst, `Hebesatz ${hebe} %${freibetrag ? ', nach Freibetrag 24.500 €' : ''}`]);
  if (KAPITAL.includes(rf)) {
    const kst = r2(g * 0.15);
    z.push(['Körperschaftsteuer (15 %)', kst, '']);
    z.push(['Solidaritätszuschlag', r2(kst * 0.055), '5,5 % der Körperschaftsteuer']);
  } else if (['einzel', 'freiberufler', 'ek', ''].includes(rf || '')) {
    const t = estTarif(g, jahr);
    const anr = gewerbe ? Math.min(r2(mess * 4), gewst, t.est) : 0;
    const est = Math.max(0, r2(t.est - anr));
    const soli = est > t.soliGrenze ? r2(Math.min(est * 0.055, (est - t.soliGrenze) * 0.119)) : 0;
    z.push(['Einkommensteuer', est, `ledig, ohne andere Einkünfte${anr ? `, nach Anrechnung der Gewerbesteuer (${eur(anr)})` : ''}`]);
    if (soli) z.push(['Solidaritätszuschlag', soli, '']);
  }
  const summe = r2(z.reduce((a, x) => a + x[1], 0));
  return { zeilen: z, summe, quote: g ? Math.round(summe / g * 100) : 0, personen: ['gbr', 'ohg'].includes(rf) };
}

/* Abgabefrist der Jahreserklärungen */
function jahresFrist(j) {
  if (S.steuer.berater) return werktag(j === 2024 ? '2026-04-30' : j === 2025 ? '2027-03-31' : iso(new Date(j + 2, 2, 0)));
  return werktag(j === 2023 ? '2024-09-02' : `${j + 1}-07-31`);
}

/* Fristen der nächsten gut 12 Monate, dazu überfällige Voranmeldungen mit Daten */
function fristen() {
  const out = [], h = heute(), y0 = Number(h.slice(0, 4)), rf = S.firma.rechtsform, E = S.steuer.erledigt || {};
  const bis = plusTage(h, 400);
  const add = (datum, key, t, s, mitDaten) => {
    datum = werktag(datum);
    if (datum > bis || (datum < h && (E[key] || !mitDaten))) return;
    out.push({ datum, key, t, s, erledigt: !!E[key] });
  };
  const d = (y, m, t) => `${y}-${String(m).padStart(2, '0')}-${String(t).padStart(2, '0')}`;
  for (let n = -4; n <= 13; n++) {
    const z = zrAus(zrRel(n));
    if (z.bis >= h) { if (!ku()) add(z.frist, 'ustva-' + z.key, `Umsatzsteuer-Voranmeldung ${z.name}`, 'Abgeben und zahlen. Die Werte stehen im Reiter Steuern.', false); continue; }
    const u = ustva(z);
    if (!ku() || u.nurRc) add(z.frist, 'ustva-' + z.key, `Umsatzsteuer-Voranmeldung ${z.name}`, `${u.zahl < 0 ? 'Erstattung' : 'Zahllast'} ${eur(Math.abs(u.zahl))}. Abgeben und zahlen.`, u.n > 0);
  }
  if (S.rechnungen.some((r) => RC[rcArt(r)] && RC[rcArt(r)].zm)) {
    const q0 = y0 * 4 + Math.floor((Number(h.slice(5, 7)) - 1) / 3);
    for (let q = q0 - 2; q <= q0 + 3; q++) {
      const y = Math.floor(q / 4), qi = q % 4;
      const von = d(y, qi * 3 + 1, 1), ende = iso(new Date(y, qi * 3 + 3, 0));
      const nd = new Date(y, qi * 3 + 3, 25);
      add(iso(nd), `zm-${y}-Q${qi + 1}`, `Zusammenfassende Meldung ${qi + 1}. Quartal ${y}`, 'EU-Geschäfte an das Bundeszentralamt für Steuern melden (BZSt-Online-Portal).', zm(von, ende).length > 0);
    }
  }
  for (const y of [y0, y0 + 1]) {
    if (!ku() && S.firma.dauerfrist && S.firma.turnus !== 'quartal') add(d(y, 2, 10), 'svz-' + y, `Sondervorauszahlung Umsatzsteuer ${y}`, 'Ein Elftel der Vorjahres-Zahllast, wegen der Dauerfristverlängerung.');
    if (num(S.steuer.vzEst)) for (const m of [3, 6, 9, 12]) add(d(y, m, 10), `vz-${y}-${m}`, `${KAPITAL.includes(rf) ? 'Körperschaftsteuer' : 'Einkommensteuer'}-Vorauszahlung ${eur(num(S.steuer.vzEst))}`, 'Laut Vorauszahlungsbescheid des Finanzamts.');
    if (num(S.steuer.vzGew)) for (const m of [2, 5, 8, 11]) add(d(y, m, 15), `gv-${y}-${m}`, `Gewerbesteuer-Vorauszahlung ${eur(num(S.steuer.vzGew))}`, 'Laut Bescheid der Gemeinde.');
  }
  for (const j of [y0 - 2, y0 - 1]) {
    const f = jahresFrist(j);
    if (f >= h) add(f, 'jahr-' + j, `Steuererklärungen ${j} abgeben`, (rf ? RECHTSFORMEN[rf].jahr : 'Einkommensteuer, Umsatzsteuer, je nach Rechtsform Gewerbesteuer') + (S.steuer.berater ? '. Frist mit Steuerberater.' : '. Frist ohne Steuerberater.'));
  }
  if (KAPITAL.includes(rf) || rf === 'ohg') add(d(y0, 12, 31), 'offen-' + (y0 - 1), `Jahresabschluss ${y0 - 1} offenlegen`, 'Beim Unternehmensregister einreichen.');
  return out.sort((a, b) => a.datum.localeCompare(b.datum));
}

    ${d.length ? `<ul class="list">${d.map((x) => `<li class="item" style="cursor:default"><span class="grow"><a href="#" data-act="file" data-id="${esc(x.dateiId)}">${esc(x.name)}</a></span><button class="chip" data-act="est-dok-del" data-k="${esc(x.dateiId)}" aria-label="${esc(x.name)} entfernen">Entfernen</button></li>`).join('')}</ul>` : ''}

/* ----- Rechnung ----- */
function estTarifJahr(zve, jahr) { return estTarif(zve, jahr).est; }

function zumutbar(gde, kinder, zusammen) {

function estRechnung(E, jahr) {

  const hb = (vor.selbstZahler ? W.sonstSelbst : W.sonstAN) * (Z ? 2 : 1);

}

/* Muss die Erklärung abgegeben werden? Vereinfachte Prüfung nach § 46 EStG und § 25 EStG mit § 56 EStDV */
function estPflicht(E, jahr, R) {
  const g = [], Z = zus(E);
  const hatLohn = E.bereiche.n && E.n.some((n) => nv(n.brutto) || nv(n.abf));
  if (R.gew) g.push('Du hast Einkünfte aus deiner Firma.');
  const neben = r2(Object.entries(R.eink).filter(([k]) => k !== 'n' && k !== 'gewerbe').reduce((a, [, v]) => a + Math.max(0, v), 0));
  if (hatLohn && neben > 410) g.push(`Neben dem Lohn hast du andere Einkünfte über 410 € (${eur(neben)}).`);
  if (!hatLohn && !R.gew && R.gde > R.gfb * (Z ? 2 : 1)) g.push('Deine Einkünfte liegen über dem Grundfreibetrag, und es wurde keine Lohnsteuer abgezogen (z. B. bei Rente oder Vermietung).');
  if (R.leSum > 410) g.push(`Du hast Elterngeld, Krankengeld, Arbeitslosengeld oder Kurzarbeitergeld über 410 € bekommen (${eur(R.leSum)}).`);
  if (E.bereiche.n && E.n.some((n) => nv(n.stkl) === 6)) g.push('Du hattest zwei Arbeitgeber gleichzeitig (Steuerklasse 6).');
  if (Z && E.bereiche.n && E.n.some((n) => [3, 5, 45].includes(nv(n.stkl)))) g.push('Ihr hattet die Steuerklassen 3 und 5 oder 4 mit Faktor.');
  if (E.bereiche.n && E.person.lstFreibetrag) g.push('Beim Lohnsteuerabzug war ein Freibetrag eingetragen.');
  if (R.abfSum) g.push('Du hast eine Abfindung oder Lohn für mehrere Jahre bekommen.');
  if (R.kapAbgeltung) g.push('Du hast Kapitalerträge, auf die keine Steuer abgezogen wurde (z. B. ausländischer Broker).');
  if (E.bereiche.u && nv(E.sa.realsplit)) g.push('Du ziehst Unterhalt an den Ex-Partner ab (dann musst du die Erklärung abgeben).');
  return { pflicht: g.length > 0, gruende: g, frist: g.length ? jahresFrist(jahr) : `${jahr + 4}-12-31` };
}
function vPflicht(E, j, R) {

/* ---------- Zahlen und Diagramme ---------- */
const MON_K = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const euro0 = (n) => Math.round(n).toLocaleString('de-DE') + ' €';
// Runde Achsenwerte (1, 2, 2,5, 5 × 10ⁿ), damit die Linien bei glatten Beträgen liegen
function achse(min, max) {
  if (max <= min) max = min + 100;
  const roh = (max - min) / 4, p = Math.pow(10, Math.floor(Math.log10(roh)));
  const schritt = [1, 2, 2.5, 5, 10].map((f) => f * p).find((x) => x >= roh);
  const lo = Math.floor(min / schritt) * schritt, hi = Math.ceil(max / schritt) * schritt, t = [];
  for (let v = lo; v <= hi + schritt / 2; v += schritt) t.push(Math.round(v));
  return { lo, hi, t };
}
// Balken mit runden Ecken nur am Datenende, gerade an der Grundlinie
function balken(x, w, y0, y1) {
  const h = Math.abs(y1 - y0); if (h < 0.5) return '';
  const r = Math.min(4, w / 2, h), oben = y1 < y0, yE = oben ? y1 : y1, s = oben ? 1 : -1;
  return `M${x},${y0}V${yE + s * r}Q${x},${yE} ${x + r},${yE}H${x + w - r}Q${x + w},${yE} ${x + w},${yE + s * r}V${y0}Z`;
}
// Diagramme in echter Pixelbreite zeichnen, damit die Schrift auf dem Handy nicht schrumpft
const CH = { w: 640, h: 230, l: 58, r: 8, t: 10, b: 26 };
function chMass(a) {
  const m = $('main'); CH.w = Math.max(260, Math.min(820, (m ? m.clientWidth : innerWidth) - 62));
  CH.l = Math.max(...a.t.map((v) => euro0(v).length)) * 7 + 10;
  CH.h = CH.w < 500 ? 190 : 230;
}
const monK = (i) => CH.w < 420 ? MON_K[i][0] : MON_K[i];
function chartMonate(ein, aus, bis) {
  const a = achse(Math.min(0, ...ein, ...aus), Math.max(0, ...ein, ...aus)); chMass(a);
  const { w, h, l, r, t, b } = CH, pw = w - l - r, ph = h - t - b;
  const y = (v) => t + ph - (v - a.lo) / (a.hi - a.lo) * ph, gw = pw / 12, bw = Math.min(18, (gw - 8) / 2);
  let g = a.t.map((v) => `<line x1="${l}" x2="${w - r}" y1="${y(v)}" y2="${y(v)}" class="${v === 0 ? 'ch-null' : 'ch-grid'}"/><text x="${l - 6}" y="${y(v) + 4}" text-anchor="end" class="ch-ax">${euro0(v)}</text>`).join('');
  for (let i = 0; i < 12; i++) {
    const cx = l + gw * i + gw / 2;
    g += `<rect class="ch-hl" data-hl="${i}" x="${l + gw * i}" y="${t}" width="${gw}" height="${ph}" rx="4"/>`;
    g += `<path class="ch-ein" d="${balken(cx - bw - 1, bw, y(0), y(ein[i]))}"/><path class="ch-aus" d="${balken(cx + 1, bw, y(0), y(aus[i]))}"/>`;
    g += `<text x="${cx}" y="${h - 8}" text-anchor="middle" class="ch-ax${i > bis ? ' ch-zukunft' : ''}">${monK(i)}</text>`;
    g += `<rect class="ch-hit" data-mon="${i}" x="${l + gw * i}" y="0" width="${gw}" height="${h}"><title>${MONATE[i]}: Einnahmen ${eur(ein[i])}, Ausgaben ${eur(aus[i])}</title></rect>`;
  }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Einnahmen und Ausgaben je Monat">${g}</svg>`;
}
function chartVerlauf(werte, bis) {
  const v = werte.slice(0, bis + 1), a = achse(Math.min(0, ...v), Math.max(0, ...v)); chMass(a);
  const { w, l, r, t, b } = CH, h = CH.h - 30, pw = w - l - r, ph = h - t - b;
  const y = (x) => t + ph - (x - a.lo) / (a.hi - a.lo) * ph, gw = pw / 12, x = (i) => l + gw * i + gw / 2;
  let g = a.t.map((z) => `<line x1="${l}" x2="${w - r}" y1="${y(z)}" y2="${y(z)}" class="${z === 0 ? 'ch-null' : 'ch-grid'}"/><text x="${l - 6}" y="${y(z) + 4}" text-anchor="end" class="ch-ax">${euro0(z)}</text>`).join('');
  for (let i = 0; i < 12; i++) g += `<rect class="ch-hl" data-hl="${i}" x="${l + gw * i}" y="${t}" width="${gw}" height="${ph}" rx="4"/><text x="${x(i)}" y="${h - 8}" text-anchor="middle" class="ch-ax${i > bis ? ' ch-zukunft' : ''}">${monK(i)}</text>`;
  g += `<polyline class="ch-linie" points="${v.map((z, i) => `${x(i)},${y(z)}`).join(' ')}"/>`;

  for (let i = 0; i < 12; i++) g += `<rect class="ch-hit" data-mon="${i}" x="${l + gw * i}" y="0" width="${gw}" height="${h}"><title>${i <= bis ? `Ende ${MONATE[i]}: ${eur(v[i])}` : MONATE[i]}</title></rect>`;

let zahlenInfo = null;
function vZahlen() {

      <div class="tile"><div class="q">Bester Monat</div><div class="v">${MON_K[uber.indexOf(Math.max(...uber.slice(0, bis + 1)))]}</div><div class="e">${eur(Math.max(...uber.slice(0, bis + 1)))} Überschuss</div></div>

function vBuchung(id) {
  const b = S.bank.find((x) => x.id === id); if (!b) return;
  const re = b.rechnungId && S.rechnungen.find((r) => r.id === b.rechnungId);
  const be = b.belegId && S.belege.find((x) => x.id === b.belegId);
  const t = bankTreffer(b), rest = b.betrag > 0 && !re ? offeneRe().filter((r) => !t.includes(r)) : [], bt = be ? [] : belegTreffer(b);
  const reBtn = (r, gut) => `<li><button class="item" data-act="bk-zu" data-id="${esc(b.id)}" data-k="${r.id}"><div class="grow"><div class="t">${esc(r.kunde.name || 'Ohne Kunde')}</div><div class="s">${esc(r.nr)} · ${dat(r.datum)}${gezahlt(r) ? ' · noch offen' : ''}</div></div><div><div class="amt">${eur(offenBetrag(r))}</div><div style="text-align:right">${gut ? '<span class="pill good">passt</span>' : ''}</div></div></button></li>`;
  openDlg(`${head(b.betrag > 0 ? 'Zahlungseingang' : 'Ausgabe')}<div class="dlg-body">
    <p style="font-size:1.4rem"><b>${eur(b.betrag)}</b></p>
    <p>${esc(b.gegenpartei || 'Ohne Namen')}<br><span class="small muted">${dat(b.datum)}${b.zweck ? ' · ' + esc(b.zweck) : ''}</span></p>
    ${re ? `<div class="card"><b>Bezahlt damit:</b> <a href="#" data-act="open-re" data-id="${re.id}">Rechnung ${esc(re.nr)}</a> an ${esc(re.kunde.name || 'Kunde')}

    ${b.betrag > 0 && !re ? `<div class="card"><b>Welche Rechnung wurde damit bezahlt?</b>
      ${t.length + rest.length ? `<ul class="list">${t.map((r) => reBtn(r, true)).join('')}${rest.map((r) => reBtn(r, false)).join('')}</ul>` : '<p class="small muted">Keine offene Rechnung vorhanden. Vielleicht eine Privateinlage oder Erstattung.</p>'}</div>` : ''}
    ${b.betrag < 0 && !b.ohneBeleg ? (be ? `<p>Beleg: <a href="#" data-act="open-be" data-id="${be.id}">${esc(be.lieferant || 'Beleg')} vom ${dat(be.datum)}</a></p>` : `${bt.length ? `<div class="card"><b>Gehört einer dieser Belege dazu?</b><ul class="list">${bt.slice(0, 5).map((x) => `<li><button class="item" data-act="bk-verkn" data-id="${esc(b.id)}" data-k="${x.id}"><div class="grow"><div class="t">${esc(x.lieferant || 'Beleg')}</div><div class="s">${dat(x.datum)}${x.kategorie ? ' · ' + esc(x.kategorie) : ''}${x.dateiName ? ' · 📎' : ''}</div></div><div><div class="amt">${eur(num(x.brutto))}</div><div style="text-align:right"><span class="pill good">passt</span></div></div></button></li>`).join('')}</ul></div>` : '<p class="small muted">Zu dieser Ausgabe gehört noch kein Beleg.</p>'}<div class="btns"><button class="primary" data-act="bk-beleg" data-id="${esc(b.id)}">Beleg dazu hochladen</button></div>`) : ''}
    ${!re && !be ? `<div class="card" style="margin-top:14px">${b.ohneBeleg ? `<p><span class="pill grey">${b.betrag > 0 ? 'Keine Rechnung nötig' : 'Kein Beleg nötig'}</span> ${esc(b.ohneBeleg)}</p><div class="btns"><button data-act="bk-ohne" data-id="${esc(b.id)}" data-k="">Doch ${b.betrag > 0 ? 'eine Rechnung' : 'einen Beleg'} zuordnen</button></div>`

function pflichtFirma() {
  const f = S.firma, m = [];
  if (!f.name) m.push('Firmenname');
  if (!f.strasse || !f.plz || !f.ort) m.push('Anschrift');
  if (!f.steuernr && !f.ustid) m.push('Steuernummer oder USt-IdNr.');
  if (!f.rechtsform) m.push('Rechtsform');
  if (REGISTER_RF.includes(f.rechtsform) && !f.registernr) m.push('Handelsregister');
  return m;
}
function gfLabel() {
  const rf = S.firma.rechtsform;
  return ['ug', 'gmbh'].includes(rf) ? 'Geschäftsführer' : rf === 'gbr' || rf === 'ohg' ? 'Vertreten durch' : 'Inhaber';
}

/* Rechtsform-Assistent */
const WZ = {
  wer: { q: 'Machst du das allein oder mit Partnern?', o: [['allein', 'Allein'], ['mehrere', 'Mit einem oder mehreren Partnern']] },

  kapital: { q: 'Wie hoch ist das Stammkapital?', o: [['klein', 'Unter 25.000 € (ab 1 €)'], ['gross', '25.000 € oder mehr']] },
  taetigkeit: { q: 'Was für eine Tätigkeit ist es?', h: 'Hast du einen Gewerbeschein, ist es ein Gewerbe.', o: [['frei', 'Freier Beruf, z. B. Berater, Designer, Texter, Ingenieur, Dozent, Arzt, Anwalt'], ['gewerbe', 'Gewerbe, z. B. Handel, Online-Shop, Handwerk, Agentur, Vermittlung']] },
  register: { q: 'Ist die Firma im Handelsregister eingetragen?', o: [['nein', 'Nein'], ['ja', 'Ja']] },
  umsatz: { q: 'Wie hoch ist dein Umsatz?', h: 'Wichtig für die Kleinunternehmerregelung.', o: [['klein', 'Letztes Jahr bis 25.000 € und dieses Jahr voraussichtlich bis 100.000 €'], ['gruendung', 'Dieses Jahr gegründet, voraussichtlich bis 25.000 €'], ['gross', 'Mehr als das']] }
};
const WZ_ORDNUNG = ['wer', 'haftung', 'kapital', 'taetigkeit', 'register', 'umsatz'];
let wiz = {};
function wizFragen(a) {
  const f = ['wer', 'haftung'];
  if (a.haftung === 'ja') f.push('kapital');
  if (a.haftung === 'nein') { f.push('taetigkeit'); if (a.taetigkeit === 'gewerbe') f.push('register'); }
  f.push('umsatz');
  return f;
}
function wizErgebnis(a) {
  if (a.haftung === 'ja') return a.kapital === 'klein' ? 'ug' : 'gmbh';
  const allein = a.wer === 'allein';
  if (a.taetigkeit === 'frei') return allein ? 'freiberufler' : 'gbr';
  return a.register === 'ja' ? (allein ? 'ek' : 'ohg') : (allein ? 'einzel' : 'gbr');
}
function vWizard() {
  const fr = wizFragen(wiz), k = fr.find((x) => !wiz[x]);
  const zurueck = fr.some((x) => wiz[x]) ? '<button data-act="wiz-back">Zurück</button>' : '';
  if (k) {
    const q = WZ[k];
    return openDlg(`${head('Rechtsform-Assistent')}<div class="dlg-body wiz">
      <div class="step">Frage ${fr.indexOf(k) + 1} von ${fr.length}</div>
      <h2>${q.q}</h2>${q.h ? `<p class="small muted">${q.h}</p>` : ''}
      <div class="opts">${q.o.map(([v, t]) => `<button data-act="wiz" data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div>
    </div><div class="dlg-foot">${zurueck}</div>`);
  }
  const rk = wizErgebnis(wiz), rf = RECHTSFORMEN[rk];
  const kuOk = wiz.umsatz !== 'gross';
  openDlg(`${head('Rechtsform-Assistent')}<div class="dlg-body wiz">
    <div class="step">Ergebnis</div>
    <h2>Das passt zu dir: ${esc(rf.label)}</h2>
    <table class="tab" style="margin-top:6px"><tr><td>Gewinnermittlung</td><td>${rf.gewinn}</td></tr><tr><td>Jahreserklärungen</td><td>${rf.jahr}</td></tr><tr><td>Besonderheit</td><td>${rf.extra}</td></tr></table>
    ${wiz.wer === 'mehrere' && rk === 'gbr' && wiz.taetigkeit === 'frei' ? '<p class="small muted" style="margin-top:6px">Freiberufler können statt der GbR auch eine Partnerschaftsgesellschaft (PartG) haben. Steuerlich wird sie hier wie eine GbR behandelt.</p>' : ''}
    <h3>Kleinunternehmerregelung</h3>
    ${kuOk ? `<p class="small">Bei deinem Umsatz ist sie möglich, aber freiwillig. Dann stellst du keine Umsatzsteuer in Rechnung, darfst aber auch keine Vorsteuer abziehen.</p>
      <label class="check"><input type="checkbox" id="wizKu"${S.firma.kleinunternehmer ? ' checked' : ''}> Ich nutze die Kleinunternehmerregelung</label>`
      : '<p class="small">Bei deinem Umsatz ist sie nicht möglich. Du stellst Umsatzsteuer in Rechnung und gibst Voranmeldungen ab.</p>'}
    <p class="small muted" style="margin-top:10px">Vereinfachte Einschätzung, vor der Nutzung mit dem Steuerberater prüfen.</p>
  </div><div class="dlg-foot">${zurueck}<button class="primary" data-act="wiz-ok" data-k="${rk}">Übernehmen</button></div>`);
}

let kTyp = 'kunden';
function merkeLieferant(name, kategorie, rc) {
  name = String(name || '').trim(); if (!name) return;
  const l = S.lieferanten.find((x) => x.name.toLowerCase() === name.toLowerCase());
  if (l) { if (kategorie && !l.kategorie) l.kategorie = kategorie; if (rc && !l.rc) l.rc = rc; }
  else S.lieferanten.push({ id: uid(), name, adresse: '', ustid: '', email: '', tel: '', kategorie: kategorie || '', rc: rc || '', notiz: '' });
}
const nameAusDatei = (n) => n.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim().slice(0, 60);
function rateLieferant(dateiname) {

  return S.lieferanten.filter((l) => l.name.length >= 3 && n.includes(l.name.toLowerCase())).sort((a, b) => b.name.length - a.name.length)[0] || null;

async function saveKontakt() {

function vNummern() {
  const j = heute().slice(0, 4);
  openDlg(`${head('Nummern')}<form id="nrForm" class="dlg-body" autocomplete="off">

    ${Object.entries(NR_ARTEN).map(([art, [t]]) => {
      const fmt = nrFormat(art), next = ((S.zaehler[art] || {})[nrKey(art, j, fmt)] || 0) + 1;
      return `<h3>${t}</h3><div class="grid2">
      <label>Aufbau<input name="f_${art}" value="${esc(fmt)}" data-art="${art}"></label>
      <label>Nächste Zahl<input name="n_${art}" inputmode="numeric" value="${next}" data-art="${art}"></label>

    }).join('')}
    <details style="margin-top:10px"><summary>Was ist erlaubt?</summary><p class="small muted" style="margin-top:6px">Rechnungsnummern müssen einmalig sein und fortlaufend vergeben werden. Lücken sind erlaubt, wenn sie erklärbar sind, zum Beispiel bei einem Wechsel des Aufbaus zum Jahresanfang. Eine Nummer, die es schon gibt, vergibt die App nie ein zweites Mal, sie springt dann automatisch weiter.</p></details>
  </form><div class="dlg-foot"><button data-act="close">Abbrechen</button><button class="primary" data-act="nr-save">Speichern</button></div>`);
  $('#nrForm').addEventListener('input', () => {
    for (const art of Object.keys(NR_ARTEN)) {
      const f = $('#nrForm').elements, fmt = f['f_' + art].value.trim();
      $('#nv_' + art).textContent = /\{N+\}/.test(fmt) ? nrBau(fmt, heute(), Math.max(1, Math.round(num(f['n_' + art].value)))) : 'Es fehlt die laufende Zahl {NNN}';
    }
  });
}
async function saveNummern() {
  const f = $('#nrForm').elements, j = heute().slice(0, 4), neu = {};
  for (const art of Object.keys(NR_ARTEN)) {
    const fmt = f['f_' + art].value.trim();
    if (!/\{N+\}/.test(fmt)) return toast(`Bei ${NR_ARTEN[art][0]} fehlt die laufende Zahl, z. B. {NNN}.`);
    if (fmt.length > 30 || /[^\w{}\-\/.#]/.test(fmt.replace(/\{(JJJJ|JJ|MM|N+)\}/g, ''))) return toast(`Bei ${NR_ARTEN[art][0]}: bitte nur Buchstaben, Zahlen und - / . # verwenden.`);
    neu[art] = { fmt, n: Math.max(1, Math.round(num(f['n_' + art].value))) };
  }
  for (const [art, { fmt, n }] of Object.entries(neu)) {
    S.firma.nummern[art] = fmt === NR_ARTEN[art][1] ? '' : fmt;
    S.zaehler[art] = S.zaehler[art] || {};
    S.zaehler[art][nrKey(art, j, fmt)] = n - 1;
  }
  await save(); closeDlg(); render(); toast('Nummern gespeichert');
}

/* ---------- Anlagenverzeichnis und Abschreibung (AfA) ---------- */
// Nutzungsdauer nach amtlicher AfA-Tabelle, Computer und Software nach BMF-Schreiben 1 Jahr (Wahlrecht). Linear und monatsgenau (§ 7 Abs. 1 EStG).
const ANLAGE_ARTEN = { computer: ['Computer, Laptop, Software, Drucker', 1, 'bga'], moebel: ['Büromöbel', 13, 'moebel'], fahrzeug: ['Auto (Pkw)', 6, 'pkw'], geraet: ['Gerät, Maschine, Werkzeug', 5, 'bga'], sonst: ['Sonstiges', 5, 'bga'] };
const GWG_GRENZE = 800;
const anlageVon = (b) => b && b.anlageId && S.anlagen.find((a) => a.id === b.anlageId);
const anlageVorschlaege = () => S.belege.filter((b) => !anlageVon(b) && b.kategorie === 'Anschaffung (Gerät, Möbel)' && r2(num(b.brutto) - num(b.vorsteuer)) > GWG_GRENZE);
// Abschreibung für Jahr y: afa, Restwert bei Abgang, Monat von/bis im Jahr, Buchwert zum Jahresanfang und -ende
function afaJahr(a, y) {
  const ak = r2(num(a.netto)), J = Math.max(1, Math.round(num(a.jahre) || 1)), y0 = Number((a.datum || '').slice(0, 4)), m0 = Number((a.datum || '').slice(5, 7)) || 1;
  const leer = { afa: 0, rest: 0, von: 1, bis: 12, anfang: 0, ende: 0 };
  if (!ak || !y0 || y < y0) return leer;
  const ya = a.abgang ? Number(a.abgang.slice(0, 4)) : 9999, ma = a.abgang ? Number(a.abgang.slice(5, 7)) : 12;
  const monate = (bisY, bisM) => Math.max(0, (bisY - y0) * 12 + bisM - m0 + 1);
  const kum = (bisY) => { if (bisY < y0) return 0; if (J === 1) return ak; const n = Math.min(J * 12, bisY >= ya ? monate(ya, ma) : monate(bisY, 12)); return n >= J * 12 ? ak : r2(ak / (J * 12) * n); };
  if (y > ya) return Object.assign({}, leer, { anfang: 0 });
  const anfang = r2(ak - kum(y - 1)), nachAfa = r2(ak - kum(y)), afa = r2(anfang - nachAfa), rest = y === ya ? nachAfa : 0;
  return { afa, rest, von: y === y0 ? m0 : 1, bis: y === ya ? ma : 12, anfang: y === y0 ? ak : anfang, ende: y === ya ? 0 : nachAfa };
}
function vAnlagen() {
  const y0 = new Date().getFullYear(), j = Number(filter.anlJahr) || y0, V = anlageVorschlaege();
  const L = S.anlagen.slice().sort((a, b) => (a.datum || '').localeCompare(b.datum || '')), sum = { afa: 0, ende: 0 };
  const rows = L.map((a) => { const x = afaJahr(a, j); sum.afa += x.afa + x.rest; sum.ende += x.ende; return { a, x }; });
  openDlg(`${head('Anlagen und Abschreibung')}<div class="dlg-body">
    <p style="margin:0 0 8px">${hb('afa', 'Wie funktioniert Abschreibung?')}</p>
    <div class="filters" role="group">${[y0, y0 - 1, y0 - 2].map((y) => `<button class="chip" data-act="anl-jahr" data-k="${y}" aria-pressed="${y === j}">${y}</button>`).join('')}</div>
    ${V.length ? `<div class="card" style="margin-top:10px"><b>Noch nicht eingetragen</b><p class="small muted" style="margin:4px 0 6px">Diese Belege sind Anschaffungen über ${eur(GWG_GRENZE)} netto. Solange sie nicht eingetragen sind, zählen sie voll im Jahr des Kaufs.</p>
      <ul class="list">${V.map((b) => `<li><button class="item" data-act="anl-neu" data-id="${b.id}"><div class="grow"><div class="t">${esc(b.lieferant || 'Beleg')}</div><div class="s">${dat(b.datum)}${b.notiz ? ' · ' + esc(b.notiz) : ''}</div></div><div><div class="amt">${eur(r2(num(b.brutto) - num(b.vorsteuer)))}</div><div style="text-align:right"><span class="pill warn">eintragen</span></div></div></button></li>`).join('')}</ul></div>` : ''}
    ${rows.length ? `<div class="tiles" style="margin:10px 0 4px"><div class="tile"><div class="q">Abschreibung ${j}</div><div class="v">${eur(r2(sum.afa))}</div><div class="e">mindert den Gewinn</div></div><div class="tile"><div class="q">Restwert 31.12.${j}</div><div class="v">${eur(r2(sum.ende))}</div><div class="e">noch abzuschreiben</div></div></div>
      <ul class="list">${rows.map(({ a, x }) => `<li><button class="item" data-act="anl-edit" data-id="${a.id}"><div class="grow"><div class="t">${esc(a.name || 'Anlage')}</div><div class="s">${dat(a.datum)} · ${eur(num(a.netto))} · ${num(a.jahre) === 1 ? 'sofort voll' : num(a.jahre) + ' Jahre'}${a.abgang ? ' · weg seit ' + dat(a.abgang) : ''}</div></div><div><div class="amt">${eur(r2(x.afa + x.rest))}</div><div class="small muted" style="text-align:right">Rest ${eur(x.ende)}</div></div></button></li>`).join('')}</ul>`
    : !V.length ? '<p class="muted" style="margin-top:10px">Noch keine Anlagen. Kaufst du etwas über 800 € netto, lädst du den Beleg mit der Kategorie „Anschaffung“ hoch und trägst es dann hier ein.</p>' : ''}
    <details style="margin-top:10px"><summary>So rechnet die App</summary><p class="small muted" style="margin-top:6px">Bis ${eur(GWG_GRENZE)} netto setzt du eine Anschaffung sofort ab, das braucht keinen Eintrag hier. Darüber wird der Preis gleichmäßig auf die Nutzungsdauer verteilt, im ersten Jahr nur für die Monate ab dem Kauf. Computer, Laptops und Software darfst du nach einem BMF-Schreiben im Jahr des Kaufs voll absetzen. Die Nutzungsdauer für Möbel, Autos und Geräte kommt aus der amtlichen AfA-Tabelle; die Vorschläge der App sind aus dem Gedächtnis eingetragen und nicht geprüft. Andere Wege, etwa die degressive Abschreibung oder den Sammelposten, kann die App nicht. Frag dafür die Kanzlei.</p></details>
  </div><div class="dlg-foot">${rows.length ? '<button data-act="anl-csv">Verzeichnis als Tabelle</button>' : ''}<button class="primary" data-act="anl-neu" data-id="">+ Anlage</button></div>`);
}

const lagerArtikel = () => S.artikel.filter((a) => a.lager).sort((a, b) => a.name.localeCompare(b.name, 'de'));

function lagerBewegungen() {

  for (const r of S.rechnungen) {
    if (!zaehlt(r) || r.extern || r.art === 'abschlag') continue;
    for (const p of r.positionen || []) {
      const a = posArtikel(p);
      if (a && ids.has(a.id) && num(p.menge)) L.push({ artikelId: a.id, datum: r.leistungsdatum || r.datum, menge: -num(p.menge), art: r.typ === 'gutschrift' ? 'storno' : 'verkauf', text: `${docTitel(r)} ${r.nr || ''} ${r.kunde && r.kunde.name || ''}`.trim(), rechnungId: r.id });

    tipps: ['Mit „Beispieldaten laden“ auf der Übersicht siehst du eine fertig befüllte Musterfirma und kannst gefahrlos ausprobieren.'],
    siehe: ['steuernummer', 'elster', 'kleinunternehmer', 'handy'] },
  steuernummer: { b: 'Anfangen', t: 'Steuernummer bekommen', kurz: 'Fragebogen zur steuerlichen Erfassung bei ELSTER.',
    text: 'Wenn du dich selbständig machst, meldest du dich beim Finanzamt mit dem „Fragebogen zur steuerlichen Erfassung“ an. Danach schickt dir das Finanzamt per Post deine Steuernummer für die Firma und sagt dir, ob du die Umsatzsteuer-Voranmeldung monatlich oder vierteljährlich abgeben musst.',
    schritte: ['Hast du ein Gewerbe (z. B. Handel, Online-Shop, Handwerk, Agentur), meldest du es zuerst beim Gewerbeamt deiner Stadt an. Viele Städte bieten das online an. Freiberufler (z. B. Berater, Designer, Texter) brauchen keine Gewerbeanmeldung.',
      'Ein ELSTER-Konto anlegen, falls du noch keins hast (eigene Anleitung).',
      'In Mein ELSTER: „Formulare &amp; Leistungen“, „Alle Formulare“, „Fragebogen zur steuerlichen Erfassung“ und dort die passende Variante wählen (z. B. „Aufnahme einer gewerblichen, selbständigen (freiberuflichen) oder land- und forstwirtschaftlichen Tätigkeit“ für Einzelunternehmer).',
      'Ausfüllen. Du wirst nach dem erwarteten Umsatz und Gewinn gefragt. Schätze ehrlich, daraus berechnet das Finanzamt mögliche Vorauszahlungen.',
      'Im Fragebogen kannst du gleich ankreuzen: Kleinunternehmerregelung ja oder nein, Ist-Versteuerung beantragen und eine USt-IdNr. beantragen, wenn du mit Firmen im EU-Ausland arbeitest.',
      'Absenden. Die Steuernummer kommt in der Regel nach einigen Wochen per Brief. Trag sie dann im Reiter Firma ein.'],
    tipps: ['Den Fragebogen musst du innerhalb eines Monats nach dem Start deiner Tätigkeit abgeben.', 'Bis die Steuernummer da ist, darfst du schon arbeiten. Rechnungen mit Umsatzsteuer brauchst du aber mit Steuernummer oder USt-IdNr., also besser warten oder die Rechnung später stellen.'],
    links: ['elsterFsE', 'gewerbe', 'faAnm'], siehe: ['elster', 'kleinunternehmer', 'istversteuerung', 'ustid'] },
  elster: { b: 'Anfangen', t: 'ELSTER-Konto anlegen', kurz: 'Zugang zum Online-Finanzamt, dauert etwa zwei Wochen.',
    text: 'ELSTER ist das kostenlose Online-Finanzamt. Darüber gibst du die Umsatzsteuer-Voranmeldung, die Steuererklärungen und Anträge ab. Für den Zugang bekommst du eine Datei (Zertifikat) und ein eigenes Passwort.',
    schritte: ['Auf elster.de auf „Benutzerkonto erstellen“ gehen und „Für mich“ wählen. Als Einzelunternehmer oder Freiberufler reicht das persönliche Konto mit deiner Steuer-Identifikationsnummer (die elfstellige Nummer, z. B. auf deiner Lohnsteuerbescheinigung).',
      'Für eine GmbH, UG oder GbR gibt es das Konto „Für eine Organisation“ mit der Steuernummer der Firma.',
      'Als Zugang die „Zertifikatsdatei“ wählen. Das ist am einfachsten und funktioniert auf jedem Computer.',
      'Daten eingeben und absenden. Du bekommst eine E-Mail mit einer Aktivierungs-ID und getrennt davon einen Brief mit dem Aktivierungs-Code.',
      'Wenn der Brief da ist: den Link aus der E-Mail öffnen, ID und Code eingeben, die Zertifikatsdatei herunterladen und ein Passwort festlegen.',
      'Die Datei gut aufheben, z. B. auf dem Computer und einem USB-Stick. Ohne sie kommst du nicht mehr hinein. Anmelden kannst du dich dann jederzeit unter „Login“.'],
    tipps: ['Der Brief mit dem Aktivierungs-Code braucht meist bis zu zwei Wochen. Fang also rechtzeitig vor der ersten Frist an.', 'Fürs Handy gibt es die App „ElsterSmart“, mit der du dich auch ohne Zertifikatsdatei anmelden kannst.'],
    links: ['elsterReg', 'elsterLogin'], siehe: ['ustva', 'steuernummer'] },
  ustva: { b: 'Umsatzsteuer', t: 'Umsatzsteuer-Voranmeldung zum ersten Mal', kurz: 'Was das ist, wann sie fällig ist und wie du sie in ELSTER abgibst.',
    text: 'Die Umsatzsteuer, die du auf deine Rechnungen schreibst, gehört dem Finanzamt. Die Umsatzsteuer, die du selbst bei Einkäufen zahlst (Vorsteuer), bekommst du zurück. Die Differenz meldest du jeden Monat oder jedes Quartal mit der Voranmeldung und zahlst sie. Die App rechnet die Zahlen aus, du tippst sie nur noch in ELSTER ab.',
    schritte: ['Im Reiter <b>Steuern</b> bei „Umsatzsteuer-Voranmeldung“ den Zeitraum wählen. Du siehst die Kennzahlen (Kz) mit den Beträgen.',
      'Auf elster.de bei Mein ELSTER anmelden.',
      '„Formulare &amp; Leistungen“, „Alle Formulare“, „Unternehmen“, „Umsatzsteuer“ und dann „Umsatzsteuer-Voranmeldung“ mit dem richtigen Jahr öffnen.',
      'Beim ersten Mal fragt ELSTER nach Steuernummer und Finanzamt. Die Steuernummer steht im Brief vom Finanzamt. Später übernimmt ELSTER das.',
      'Den Zeitraum wählen (z. B. Oktober oder 3. Quartal).',
      'Die Werte aus der App in die gleichen Kennzahlen eintragen. Am wichtigsten: Kz 81 (Umsätze mit 19 %, ohne Steuer), Kz 86 (Umsätze mit 7 %) und Kz 66 (Vorsteuer). Die Steuer zu 81 und 86 rechnet ELSTER selbst aus.',
      'Auf „Prüfen“ klicken. Vergleiche das Ergebnis bei Kz 83 mit der Zahl in der App. Passt es, „Absenden“.',
      'Den Betrag bis zur Frist ans Finanzamt zahlen (eigene Anleitung „Steuern ans Finanzamt zahlen“). Bei einer Erstattung überweist das Finanzamt dir das Geld.',
      'In der App „Als abgegeben markieren“. Dann verschwindet die Frist aus deiner Liste.'],
    tipps: ['Frist ist der 10. Tag nach Ende des Monats oder Quartals, also z. B. der 10. November für Oktober. Mit Dauerfristverlängerung einen Monat später.',
      'Auch wenn du in einem Monat nichts verkauft hast, musst du eine Voranmeldung abgeben, dann eben mit 0 (Nullmeldung).',
      'Ob monatlich oder vierteljährlich, legt das Finanzamt fest und schreibt es dir. Stell es im Reiter Firma ein.',
      'Gibst du zu spät ab, kann das Finanzamt einen Verspätungszuschlag festsetzen. Zahlst du zu spät, kostet das 1 % Säumniszuschlag je angefangenem Monat.',
      'Hast du dich vertan, gibst du einfach eine neue Voranmeldung für denselben Zeitraum ab und setzt dort den Haken bei „berichtigte Anmeldung“.'],
    links: ['elsterLogin', 'elsterUstva'], siehe: ['zahlen', 'dauerfrist', 'elster', 'reversecharge'] },
  zahlen: { b: 'Umsatzsteuer', t: 'Steuern ans Finanzamt zahlen', kurz: 'Überweisen oder einfacher: Lastschrift erlauben.',
    text: 'Die Voranmeldung abgeben heißt noch nicht bezahlen. Das Geld musst du selbst überweisen oder dem Finanzamt erlauben, es abzubuchen.',
    schritte: ['<b>Am einfachsten: Lastschrift.</b> Auf der Website deines Finanzamts gibt es das Formular „SEPA-Lastschriftmandat“. Ausfüllen, unterschreiben und per Post ans Finanzamt schicken. Danach bucht das Finanzamt jede Steuer pünktlich zur Frist ab, du kannst keine Zahlung mehr vergessen.',
      '<b>Oder überweisen.</b> Die Bankverbindung deines Finanzamts steht auf jedem Brief und Bescheid vom Finanzamt und auf seiner Website.',
      'Als Verwendungszweck: deine Steuernummer, die Steuerart und den Zeitraum, z. B. „123/456/78901 USt 10/2026“. Sonst kann das Finanzamt die Zahlung nicht zuordnen.',
      'Rechtzeitig überweisen. Maßgeblich ist, wann das Geld beim Finanzamt ankommt.',
      'Die Zahlung taucht später im Reiter Bank auf. Markiere sie dort als „ohne Beleg“ (Steuerzahlung), dann stimmt auch der Export für den Steuerberater.'],
    tipps: ['Für Überweisungen gibt es drei Tage Schonfrist, bevor Säumniszuschläge anfallen. Darauf solltest du dich nicht verlassen, bei Lastschrift brauchst du sie nicht.', 'Leg für die Steuer am besten ein eigenes Unterkonto an. Wie viel drauf sollte, zeigt die Steuer-Rücklage auf der Übersicht.'],
    siehe: ['ustva', 'vorauszahlung'] },
  dauerfrist: { b: 'Umsatzsteuer', t: 'Dauerfristverlängerung: einen Monat mehr Zeit', kurz: 'Voranmeldung immer einen Monat später abgeben.',
    text: 'Mit der Dauerfristverlängerung gibst du jede Voranmeldung einen Monat später ab, also z. B. für Oktober erst am 10. Dezember statt am 10. November. Das ist praktisch, wenn Belege oft spät kommen. Das Finanzamt stimmt in der Regel zu.',
    schritte: ['In Mein ELSTER das Formular „Antrag auf Dauerfristverlängerung / Anmeldung der Sondervorauszahlung“ öffnen (Umsatzsteuer, gleiche Stelle wie die Voranmeldung).',
      'Gibst du monatlich ab, musst du eine Sondervorauszahlung leisten: ein Elftel der Umsatzsteuer, die du im Vorjahr insgesamt vorangemeldet hast. Im ersten Jahr schätzt du sie anhand deines erwarteten Umsatzes. Die Sondervorauszahlung wird mit der Voranmeldung für Dezember verrechnet, du bekommst sie also zurück.',
      'Gibst du vierteljährlich ab, gibt es keine Sondervorauszahlung.',
      'Absenden und die Sondervorauszahlung zahlen.',
      'In der App im Reiter Firma den Haken bei „Dauerfristverlängerung“ setzen und im Reiter Steuern unter „Einstellungen“ die Sondervorauszahlung eintragen. Dann stimmen alle Fristen.'],
    tipps: ['Den Antrag stellst du bis zur Frist der ersten Voranmeldung, für die er gelten soll: bei monatlicher Abgabe also bis 10. Februar, bei vierteljährlicher bis 10. April.', 'Der Antrag gilt so lange, bis du ihn zurücknimmst oder das Finanzamt ihn widerruft. Monatszahler melden die Sondervorauszahlung aber jedes Jahr neu an.'],
    links: ['elsterDfv', 'elsterDfvQ'], siehe: ['ustva'] },
  kleinunternehmer: { b: 'Umsatzsteuer', t: 'Bin ich Kleinunternehmer?', kurz: 'Keine Umsatzsteuer auf Rechnungen, wenn dein Umsatz klein ist.',
    text: 'Als Kleinunternehmer schreibst du keine Umsatzsteuer auf deine Rechnungen und gibst keine Voranmeldungen ab. Dafür bekommst du auch die Umsatzsteuer aus deinen Einkäufen nicht zurück. Seit 2025 gilt: Umsatz im Vorjahr höchstens 25.000 € und im laufenden Jahr höchstens 100.000 € (jeweils ohne Umsatzsteuer).',
    schritte: ['Prüfen, ob dein Umsatz unter den Grenzen bleibt. Im Gründungsjahr zählt, ob du voraussichtlich unter 25.000 € bleibst.',
      'Lohnt es sich? Verkaufst du vor allem an Privatleute, ist es meist ein Vorteil, weil deine Preise ohne Umsatzsteuer günstiger sind. Verkaufst du an Firmen oder kaufst du viel ein (z. B. teure Geräte), kann die normale Umsatzsteuer günstiger sein.',
      'Die Entscheidung teilst du dem Finanzamt mit, meist gleich im Fragebogen zur steuerlichen Erfassung.',
      'In der App im Reiter Firma den Haken „Ich bin Kleinunternehmer“ setzen. Dann stellt die App Rechnungen ohne Umsatzsteuer und mit dem nötigen Hinweis aus.',
      'Den Kleinunternehmer-Wächter auf der Übersicht im Blick behalten. Er warnt dich, bevor du über die Grenze kommst.'],
    tipps: ['Auf jede Rechnung gehört ein Hinweis, z. B. „Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.“ Das macht die App automatisch.',
      'Wer freiwillig auf die Regelung verzichtet, ist fünf Jahre daran gebunden.',
      'Wer über 100.000 € kommt, muss schon ab der Rechnung, die die Grenze überschreitet, Umsatzsteuer berechnen.',
      'Kaufst du Werbung bei Google, Meta oder anderen Firmen im Ausland, musst du darauf trotzdem Umsatzsteuer ans Finanzamt zahlen (siehe „Rechnungen aus dem Ausland“).'],
    links: ['p19'], siehe: ['reversecharge', 'steuernummer'] },
  istversteuerung: { b: 'Umsatzsteuer', t: 'Soll- oder Ist-Versteuerung?', kurz: 'Zahlst du die Umsatzsteuer bei Rechnung oder erst bei Zahlung?',
    text: 'Normal ist die Soll-Versteuerung: Die Umsatzsteuer ist fällig, sobald du die Rechnung schreibst, auch wenn der Kunde noch nicht bezahlt hat. Bei der Ist-Versteuerung zahlst du sie erst, wenn das Geld da ist. Das schont die Kasse.',
    schritte: ['Ist-Versteuerung bekommen Freiberufler und alle, deren Umsatz im Vorjahr höchstens 800.000 € war. Sie gilt aber nur, wenn das Finanzamt sie genehmigt.',
      'Beantragen kannst du sie im Fragebogen zur steuerlichen Erfassung oder später mit einem kurzen Schreiben ans Finanzamt (in Mein ELSTER über „Sonstige Nachricht an das Finanzamt“).',
      'Wenn die Genehmigung da ist: im Reiter Steuern unter „Einstellungen für Steuern“ auf „Ist“ umstellen.'],
    tipps: ['Die Vorsteuer aus deinen Einkäufen ziehst du in beiden Fällen nach dem Rechnungsdatum ab.', 'Stell nur um, was das Finanzamt dir bestätigt hat, sonst stimmen deine Voranmeldungen nicht.'],
    links: ['elsterLogin'], siehe: ['ustva', 'steuernummer'] },
  reversecharge: { b: 'Rechnungen', t: 'Rechnungen ins Ausland und aus dem Ausland', kurz: 'Wann der Kunde die Umsatzsteuer zahlt (Reverse Charge).',
    text: 'Bei Geschäften mit Firmen im Ausland zahlt oft nicht der Verkäufer, sondern der Kunde die Umsatzsteuer in seinem Land. Das heißt „Reverse Charge“ oder „Steuerschuldnerschaft des Leistungsempfängers“.',
    schritte: ['<b>Du verkaufst an eine Firma in einem anderen EU-Land:</b> Du brauchst ihre USt-IdNr. und eine eigene. Prüfe ihre Nummer vorher beim Bundeszentralamt für Steuern. In der Rechnung als Steuerfall „EU-Firma“ wählen, dann schreibt die App 0 % und den Pflicht-Hinweis drauf.',
      'Diese Umsätze meldest du zusätzlich in der Zusammenfassenden Meldung (eigene Anleitung).',
      '<b>Du verkaufst an eine Firma außerhalb der EU</b> (z. B. Schweiz, USA): meist ebenfalls ohne deutsche Umsatzsteuer, Steuerfall entsprechend wählen.',
      '<b>Du kaufst bei einer Firma im Ausland ein</b> (z. B. Werbung bei Google Ireland oder Meta, Software aus den USA): Auf der Rechnung steht keine deutsche Umsatzsteuer. Du musst sie selbst ans Finanzamt melden. Markiere solche Belege in der App, dann rechnet sie die Steuer in die Voranmeldung ein.',
      'Bist du nicht Kleinunternehmer, ziehst du dieselbe Summe gleich wieder als Vorsteuer ab. Unterm Strich zahlst du dann nichts, musst es aber melden.'],
    tipps: ['Kleinunternehmer zahlen die Steuer auf solche Einkäufe, ohne sie zurückzubekommen, und müssen dafür eine Voranmeldung abgeben.', 'Verkaufst du an Privatleute im EU-Ausland, gelten andere Regeln (ab 10.000 € im Jahr die Steuer des Kundenlandes). Dafür lieber mit einem Steuerberater sprechen.'],
    links: ['p13b', 'ustid'], siehe: ['ustid', 'zm', 'ustva'] },
  ustid: { b: 'Rechnungen', t: 'USt-IdNr. beantragen', kurz: 'Brauchst du für Geschäfte mit Firmen in anderen EU-Ländern.',
    text: 'Die Umsatzsteuer-Identifikationsnummer (z. B. DE123456789) brauchst du, wenn du Firmen in anderen EU-Ländern Rechnungen schreibst oder bei ihnen einkaufst. Sie ist kostenlos.',
    schritte: ['Am einfachsten gleich im Fragebogen zur steuerlichen Erfassung ankreuzen.',
      'Später geht es über das Online-Formular des Bundeszentralamts für Steuern (BZSt). Du brauchst deine Steuernummer und das zuständige Finanzamt.',
      'Die Nummer kommt per Brief. Trag sie im Reiter Firma ein, dann steht sie auf jeder Rechnung.'],
    tipps: ['Auch Kleinunternehmer können eine USt-IdNr. bekommen, z. B. für Werbung bei Google oder Meta.', 'Die USt-IdNr. deiner EU-Kunden kannst du beim BZSt kostenlos auf Gültigkeit prüfen.'],
    links: ['ustid'], siehe: ['reversecharge', 'zm'] },
  zm: { b: 'Umsatzsteuer', t: 'Zusammenfassende Meldung', kurz: 'Geschäfte mit EU-Firmen ans Bundeszentralamt melden.',
    text: 'Schreibst du Rechnungen ohne Umsatzsteuer an Firmen in anderen EU-Ländern, meldest du diese Umsätze zusätzlich in der Zusammenfassenden Meldung (ZM). Die App sammelt die Kunden und Beträge im Reiter Steuern.',
    schritte: ['Im Reiter Steuern bei „Zusammenfassende Meldung“ die Liste ansehen. Fehlt bei einem Kunden die USt-IdNr., erst nachtragen.',
      'In Mein ELSTER „Formulare &amp; Leistungen“, „Alle Formulare“ und dort „Zusammenfassende Meldung“ öffnen. Das BZSt-Online-Portal brauchen nur Firmen mit sehr vielen Meldungen.',
      'Für jeden Kunden Land, USt-IdNr., Betrag und Art (Lieferung oder Dienstleistung) eintragen.',
      'Absenden, bis zum 25. Tag nach Ende des Quartals.'],
    tipps: ['Bei Warenlieferungen über 50.000 € im Quartal meldest du monatlich.', 'Die Umsätze gehören außerdem in die Voranmeldung. Das macht die App automatisch.'],
    links: ['elsterZm', 'zm'], siehe: ['reversecharge', 'ustid'] },
  rechnung: { b: 'Rechnungen', t: 'Was muss auf eine Rechnung?', kurz: 'Die Pflichtangaben, die das Finanzamt sehen will.',
    text: 'Fehlt auf einer Rechnung eine Pflichtangabe, kann dein Kunde die Vorsteuer nicht abziehen und verlangt eine neue. Die App prüft das beim Schreiben und zeigt, was fehlt.',
    schritte: ['Dein Name und deine Anschrift, und Name und Anschrift des Kunden.',
      'Deine Steuernummer oder USt-IdNr.',
      'Rechnungsdatum und eine fortlaufende Rechnungsnummer, die es nur einmal gibt. Die vergibt die App.',
      'Menge und Art der Leistung oder Ware, und wann du geliefert oder gearbeitet hast (Leistungsdatum oder -zeitraum).',
      'Nettobetrag, Steuersatz und Steuerbetrag, oder ein Hinweis, warum keine Steuer drauf ist (Kleinunternehmer, Reverse Charge).'],
    tipps: ['Bis 250 € (Kleinbetragsrechnung) reichen weniger Angaben, z. B. ohne Anschrift des Kunden.', 'Eine gestellte Rechnung änderst du nicht mehr, sondern stornierst sie und schreibst eine neue. Das macht die App mit einer Stornorechnung.'],
    links: ['p14'], siehe: ['erechnung', 'mahnung'] },
  erechnung: { b: 'Rechnungen', t: 'E-Rechnung: was gilt wann?', kurz: 'Empfangen musst du sie schon, schreiben bald auch.',
    text: 'Eine E-Rechnung ist eine Rechnung als Datei, die ein Computer lesen kann (z. B. XRechnung oder ZUGFeRD). Ein normales PDF zählt nicht dazu. Die Pflicht kommt in Stufen und gilt nur zwischen Firmen in Deutschland, nicht bei Privatkunden.',
    schritte: ['<b>Seit 1. Januar 2025</b> musst du E-Rechnungen empfangen können. Eine E-Mail-Adresse reicht dafür.',
      '<b>Ab 1. Januar 2027</b> müssen Firmen mit mehr als 800.000 € Umsatz im Vorjahr E-Rechnungen schreiben.',
      '<b>Ab 1. Januar 2028</b> gilt das für alle Firmen.',
      'In der App kannst du jede Rechnung schon jetzt als E-Rechnung herunterladen: als XRechnung-Datei oder als PDF mit eingebauter E-Rechnung (ZUGFeRD). Das PDF ist am praktischsten, weil Menschen und Programme es lesen können.'],
    tipps: ['Kleinunternehmer und Rechnungen bis 250 € sind von der Pflicht zum Schreiben ausgenommen.', 'Öffentliche Auftraggeber (Behörden) verlangen meist schon heute eine XRechnung mit ihrer Leitweg-ID.'],
    links: ['p14'], siehe: ['rechnung'] },
  mahnung: { b: 'Rechnungen', t: 'Kunde zahlt nicht: so mahnst du richtig', kurz: 'Erinnerung, Mahnung, Verzugszinsen und Mahnbescheid.',
    text: 'Erst freundlich erinnern, dann mahnen. Die App schlägt dir die Schritte vor und rechnet Zinsen und Gebühren aus.',
    schritte: ['Nach Ablauf des Zahlungsziels erst prüfen, ob das Geld vielleicht doch da ist (Reiter Bank).',
      'Eine freundliche Zahlungserinnerung schicken. Viele haben die Rechnung einfach vergessen.',
      'Kommt nichts, eine Mahnung mit neuer Frist schicken, danach eine letzte Mahnung.',
      'Spätestens 30 Tage nach Fälligkeit und Zugang der Rechnung ist der Kunde automatisch in Verzug. Bei Privatkunden gilt das nur, wenn auf der Rechnung darauf hingewiesen wurde. Ab dann darfst du Verzugszinsen verlangen.',
      'Zahlt der Kunde gar nicht, kannst du online einen gerichtlichen Mahnbescheid beantragen. Das kostet eine Gebühr, die der Kunde am Ende zahlen muss.'],
    tipps: ['Verzugszinsen: bei Firmen 9 Prozentpunkte über dem Basiszinssatz, bei Privatleuten 5. Von Firmen darfst du zusätzlich 40 € Pauschale verlangen.', 'Den Basiszinssatz trägst du im Reiter Firma ein. Er ändert sich am 1. Januar und 1. Juli.'],
    links: ['p286', 'p288', 'basis', 'mahnOnline'], siehe: ['rechnung'] },
  belege: { b: 'Belege und Bank', t: 'Belege richtig sammeln', kurz: 'Was ein guter Beleg ist und wie lange du ihn aufhebst.',
    text: 'Jede Ausgabe braucht einen Beleg, sonst zählt sie nicht. Fotografiere Belege am besten sofort mit dem Plus-Knopf, dann geht nichts verloren.',
    schritte: ['Foto oder PDF hochladen, Lieferant, Datum, Betrag und Kategorie eintragen.',
      'Steht Umsatzsteuer auf dem Beleg, die Vorsteuer übernehmen. Die bekommst du über die Voranmeldung zurück.',
      'Bei Bewirtung (Geschäftsessen) auf dem Beleg Anlass und Teilnehmer notieren. Absetzbar sind 70 %.',
      'Geräte über 800 € netto werden über mehrere Jahre abgeschrieben (Anleitung „Abschreibung“).',
      'Einmal im Monat im Reiter Bank prüfen, ob zu jeder Abbuchung ein Beleg da ist.'],
    tipps: ['Belege und Rechnungen musst du 8 Jahre aufheben, Bücher und Jahresabschlüsse 10 Jahre. Kommt eine Rechnung digital (PDF, E-Rechnung), musst du die Datei aufheben, ein Ausdruck reicht nicht.', 'Die App speichert alles nur auf diesem Gerät. Lade regelmäßig eine Sicherung herunter. Eine geprüfte Archivierung nach den Regeln des Finanzamts (GoBD) ist sie noch nicht.'],
    links: ['p147'], siehe: ['afa', 'bank', 'sicherung'] },
  bank: { b: 'Belege und Bank', t: 'Kontoauszug als CSV holen', kurz: 'So kommen deine Bankbuchungen in die App.',
    text: 'Die App liest Kontoauszüge als CSV-Datei (eine Tabelle, die sich auch in Excel öffnen lässt). Damit ordnet sie Zahlungen deinen Rechnungen zu und findet Abbuchungen ohne Beleg.',
    schritte: ['<b>Qonto:</b> In der Qonto-App oder im Browser auf „Transaktionen“, dann „Exportieren“ und „CSV“ wählen, Zeitraum einstellen und herunterladen.',
      '<b>Andere Banken:</b> Im Online-Banking die Umsätze öffnen und nach „Export“, „Herunterladen“ oder „CSV“ suchen. Bei Sparkassen heißt es oft „Umsätze exportieren“ mit dem Format „CSV-CAMT“.',
      'Im Reiter <b>Bank</b> auf „Kontoauszug (CSV) hochladen“ und die Datei wählen.',
      'Die App übernimmt nur neue Buchungen. Du kannst also ruhig immer den ganzen Monat hochladen.',
      'Danach Zahlungen den Rechnungen zuordnen und fehlende Belege ergänzen.'],
    tipps: ['Am besten einmal im Monat, z. B. vor der Voranmeldung.'], siehe: ['belege'] },

/* Angebot / Rechnung bearbeiten */
let edit = null;

  const t = heute();
  return {
    id: uid(), typ, nr: '', datum: t, leistungsdatum: t,
    faellig: typ === 'rechnung' ? plusTage(t, num(S.firma.zahlungsziel) || 14) : '',
    gueltigBis: typ === 'angebot' ? plusTage(t, num(S.firma.angebotTage) || 30) : '',
    kunde: { name: '', adresse: '', ustid: '', email: '', leitweg: '', land: '' },
    positionen: [{ text: '', menge: 1, einheit: 'Stk.', preis: 0, ust: 19 }],
    hinweis: '', status: typ === 'rechnung' ? 'entwurf' : 'offen', ku: ku(),
    skontoProz: typ === 'rechnung' ? num(S.firma.skontoProz) : 0, skontoTage: typ === 'rechnung' ? num(S.firma.skontoTage) : 0
  };
}
/* Skonto: x % weniger bei Zahlung innerhalb von n Tagen ab Rechnungsdatum */
const hatSkonto = (d) => d.typ === 'rechnung' && num(d.skontoProz) > 0 && num(d.skontoTage) > 0;
function skontoText(d) {
  if (!hatSkonto(d)) return '';
  const b = summen(d).brutto;
  return `Bei Zahlung bis zum ${dat(plusTage(d.datum, num(d.skontoTage)))} ziehen Sie bitte ${String(d.skontoProz).replace('.', ',')} % Skonto ab und überweisen ${eur(r2(b - b * num(d.skontoProz) / 100))}.`;
}
/* Artikel und Leistungen, die man immer wieder abrechnet */
function artikelPosition(a) {
  return { text: a.name, menge: 1, einheit: a.einheit || 'Stk.', preis: num(a.preis), ust: edit && (edit.ku || edit.rc) ? 0 : num(a.ust), rabatt: 0, artikelId: a.id };
}
function readEditor() {

  Object.assign(edit, { datum: g('datum'), leistungsdatum: g('leistungsdatum'), faellig: g('faellig'), gueltigBis: g('gueltigBis'), hinweis: g('hinweis'), rc: edit.ku ? '' : g('rc') });
  edit.kunde = { name: g('k_name').trim(), adresse: g('k_adresse').trim(), ustid: g('k_ustid').trim(), email: g('k_email').trim(), leitweg: g('k_leitweg').trim(), land: g('k_land').trim().toUpperCase() };
  edit.positionen = [...f.querySelectorAll('.pos')].map((p) => ({

  if (f.elements.skontoProz) Object.assign(edit, { skontoProz: num(g('skontoProz')), skontoTage: Math.round(num(g('skontoTage'))) });
  if (edit.artSchluss || istSchluss(edit)) { const ids = [...f.querySelectorAll('[name=abz]:checked')].map((x) => x.value); edit.abzuege = S.rechnungen.filter((x) => ids.includes(x.id)).map(abzugAus); }
}
function pflichtDoc(d) {
  const f = S.firma, c = [];

  c.push(['Steuernummer oder USt-IdNr.', !!(f.steuernr || f.ustid)]);
  c.push(['Name und Anschrift des Kunden', !!(d.kunde.name && d.kunde.adresse)]);
  c.push(['Rechnungsdatum', !!d.datum]);
  c.push(['Leistungsdatum oder -zeitraum', !!d.leistungsdatum]);
  c.push(['Jede Position mit Beschreibung und Preis', d.positionen.length > 0 && d.positionen.every((p) => p.text.trim() && num(p.menge) !== 0)]);
  if (RC[d.rc] && RC[d.rc].idPflicht) c.push(['USt-IdNr. des Kunden (EU-Geschäft)', /^[A-Z]{2}[0-9A-Z+*]{2,12}$/.test(String(d.kunde.ustid || '').replace(/\s/g, '').toUpperCase())]);
  c.push([d.ku ? 'Hinweis auf Kleinunternehmerregelung' : RC[d.rc] ? 'Hinweis auf den Steuerfall' : 'Steuersatz und Steuerbetrag', true]);

}

function kuWarnung(d) {
  if (!d.ku || d.typ !== 'rechnung' || d.status !== 'entwurf') return '';
  const y = (d.datum || heute()).slice(0, 4), vorher = kuUmsatz(y, d.id).summe, danach = r2(vorher + summen(d).netto);
  const grenze = Number(S.firma.gruendung) === Number(y) ? KU_VORJAHR : KU_GRENZE;
  if (danach > grenze) return `<div class="card" style="margin-top:10px;border-color:var(--bad)"><b style="color:var(--bad)">Mit dieser Rechnung überschreitest du ${eur(grenze)}.</b><p class="small" style="margin:4px 0 0">Umsatz ${y} bisher ${eur(vorher)}, danach ${eur(danach)}. Ab dieser Rechnung gilt die Kleinunternehmerregelung nicht mehr, sie muss schon mit Umsatzsteuer gestellt werden. Nimm im Reiter Firma den Haken bei Kleinunternehmer heraus und leg die Rechnung neu an. Im Zweifel vorher den Steuerberater fragen.</p></div>`;
  if (vorher <= KU_VORJAHR && danach > KU_VORJAHR && grenze !== KU_VORJAHR) return `<div class="card" style="margin-top:10px;border-color:var(--warn)"><b>Mit dieser Rechnung kommst du über ${eur(KU_VORJAHR)}.</b><p class="small" style="margin:4px 0 0">Dieses Jahr darfst du sie noch ohne Umsatzsteuer stellen. Ab ${Number(y) + 1} bist du aber kein Kleinunternehmer mehr.</p></div>`;
  return '';
}

    ${isRe && !gut && (d.artSchluss || istSchluss(d)) ? `<h3>Abschläge abziehen</h3>${abList.length ? `<div id="abzList">${abList.map((x) => `<label class="check"><input type="checkbox" name="abz" value="${x.id}"${gewaehlt.has(x.id) ? ' checked' : ''}> ${esc(x.nr)} vom ${dat(x.datum)}: ${eur(summen(x).netto)} netto, ${eur(summen(x).brutto)} brutto${hatZahlung(x) ? '' : ' <span class="small muted">(noch nicht bezahlt)</span>'}</label>`).join('')}</div>` : `<p class="small muted">Für ${esc(d.kunde.name || 'diesen Kunden')} gibt es keine Abschlagsrechnung, die noch nicht abgezogen wurde. Der Kundenname muss genau gleich geschrieben sein.</p>`}` : ''}

function refreshEditor() {
  readEditor();
  $('#totals').innerHTML = totalsHtml(edit);
  if ($('#kuWarn')) $('#kuWarn').innerHTML = kuWarnung(edit);
  document.querySelectorAll('#posList .pos').forEach((el, i) => { el.querySelector('.sum').textContent = eur(posNetto(edit.positionen[i])); });
  if (edit.typ !== 'angebot') {
    const c = pflichtDoc(edit), ok = c.every((x) => x[1]);
    $('#checks').innerHTML = c.map((x) => `<li class="${x[1] ? 'ok' : 'miss'}">${x[0]}</li>`).join('');
    $('#chkHead').textContent = ok ? 'Alle Pflichtangaben nach § 14 UStG sind da' : 'Es fehlen noch Pflichtangaben';
    $('#btnStellen').disabled = !ok;
  }
}
function merkeKunde(k) {
  if (!k.name) return;
  const i = S.kunden.findIndex((x) => x.name.toLowerCase() === k.name.toLowerCase());
  if (i >= 0) S.kunden[i] = Object.assign({}, S.kunden[i], Object.fromEntries(Object.entries(k).filter(([, v]) => v)));
  else S.kunden.push(Object.assign({ id: uid() }, k));
}
async function saveDoc(stellen) {
  readEditor();
  const d = edit; delete d.neu;
  const coll = d.typ === 'angebot' ? S.angebote : S.rechnungen;
  if (d.typ === 'angebot' && !d.nr) d.nr = naechsteNr('AN', d.datum || heute());
  if (stellen) {
    if (!pflichtDoc(d).every((c) => c[1])) return toast('Es fehlen noch Pflichtangaben.');
    if (d.typ === 'gutschrift' && summen(d).brutto >= 0) return toast('Eine Korrektur muss einen Minus-Betrag haben. Mengen bitte mit Minus eintragen.');
    d.nr = naechsteNr('RE', d.datum || heute());
    d.status = 'offen'; d.gestelltAm = heute();
  }
  merkeKunde(d.kunde);
  const i = coll.findIndex((x) => x.id === d.id);
  if (i >= 0) coll[i] = d; else coll.push(d);
  if (d.ausAngebot && stellen) { const a = S.angebote.find((x) => x.id === d.ausAngebot); if (a) a.status = 'abgerechnet'; }
  if (stellen && d.typ === 'gutschrift') { const o = S.rechnungen.find((x) => x.id === d.stornoVon); if (o && o.zahlungen && o.zahlungen.length) zahlStatus(o); }
  await save();
  toast(stellen ? `${docTitel(d)} ${d.nr} gestellt` : 'Gespeichert');
  tab = d.typ === 'angebot' ? 'angebote' : 'rechnungen';
  if (stellen) vDetailRe(d.id); else closeDlg();
  render();
}

const MAHN = [null,

const mahnStufe = (r) => (r.mahnungen || []).length;

  $('#druck').innerHTML = `
